# SonarQube Cloud analysis configuration
# https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

# Project binding. Analysis runs through SonarQube Cloud Automatic Analysis (no
# scanner step in .github/workflows), so the binding is what actually decides the
# project. This key is declared anyway so local tooling resolves it from the repo
# instead of having to query the API.
sonar.projectKey=Disble_autoreas-bridge

# Exclusions are for source we do not author. Everything we do author -- tests,
# build scripts -- stays in the analysis and gets fixed or marked in SonarQube.
# Measured 2026-09-02 against 283 open issues:
#
#   **/.agents/skills/**, **/.claude/skills/**, **/skills/**
#       Vendored skill/agent definitions, not project code.
#
#   **/testdata/**
#       Go fixture directories. internal/download/sites/jkanime/testdata/
#       buscar_dr_stone.html alone produced 37 issues (16 commented-out-code,
#       5 CRITICAL duplicate-id) -- it is a page scraped verbatim from jkanime.
#       Auditing a third party's markup tells us nothing about this codebase.
#
#   **/*.dc.html
#       design-canvas artboards generated by the `design` skill under
#       openspec/changes/**. Produced 49 issues, 33 of them css:S7924 text
#       contrast, on markup no human writes or edits by hand.
sonar.exclusions=**/.agents/skills/**,**/.claude/skills/**,**/skills/**,**/testdata/**,**/*.dc.html
