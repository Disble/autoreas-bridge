schema: spec-driven

context: |
  Tech stack: Go module + Wails v2 desktop shell + React 18/Vite 3/TypeScript 4.6 frontend.
  Architecture: Hexagonal/ports-adapters with bounded contexts and in-memory event bus.
  Domain focus: Legacy NeDB JSON-line (`animes.dat`) as source of truth plus SQLite bridge state.
  Current codebase: Wails starter scaffold; domain packages under `internal/` are not implemented yet.
  Style: gofmt, go vet, golangci-lint available; frontend uses strict TypeScript.

strict_tdd: true

testing:
  detected: 2026-04-05
  strict_tdd: true
  test_runner:
    available: true
    framework: go test
    command: go test ./...
  layers:
    unit:
      available: true
      tool: go test
    integration:
      available: true
      tool: net/http/httptest + go test
    e2e:
      available: false
      tool: ""
  coverage:
    available: true
    command: go test ./... -cover
  quality_tools:
    linter:
      available: true
      command: golangci-lint run
    type_checker:
      available: true
      command: go vet ./...
    formatter:
      available: true
      command: gofmt -w .

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
