# Pre-commit gate.
#
# ── Concurrency budget ───────────────────────────────────────────────────────
# Go tools default their internal parallelism to the logical CPU count (20 on
# the reference machine: i7-12700K, 12 cores / 20 threads). Under the previous
# flat `parallel: true` across 14 jobs, `go vet ./...`, `go test ./...` and two
# golangci-lint passes EACH claimed all 20 threads at the same time — 60+
# CPU-bound threads on a 20-thread box. Nothing was left to redraw the desktop,
# so the machine appeared frozen until the gate finished. Measured proof from
# that era: `frontend-filesize-warning`, a script that only reads file lengths,
# took 34s because it never got scheduled.
#
# The shape below is: one parallel group of cheap checks, plus exactly two
# piped lanes for the genuinely expensive work. Peak is ~2 heavy tools x 4
# threads, leaving most of the machine responsive. Every Go job pins `-p`
# (package build/test parallelism) and GOMAXPROCS to 4.
#
# Do not restore a flat `parallel: true`, do not remove the `-p=4` / GOMAXPROCS
# pins, and do not move a cheap job into a piped lane — serialising cheap work
# behind vitest cost 110s in testing for no benefit.
# See docs/pre-commit-performance.md for the before/after measurements.
#
# ── Job selection ────────────────────────────────────────────────────────────
# Jobs are globbed to the files they actually judge. A docs-only commit no
# longer compiles and tests the whole Go module, and a Go-only commit no longer
# runs vitest. This does not weaken the gate: unchanged Go source cannot change
# the Go verdict. Keep the glob lists in sync when a checker gains a new input.
#
# Job ORDER inside `quick` is asserted by tools/checkgofilesize/hook_order_test.go
# and repository_policy_test.go, which flatten these groups: gofmt runs
# immediately before go-filesize and go-filesize before golangci-lint, so the
# cheapest signal always lands first.
#
# ── What dharness owns ───────────────────────────────────────────────────────
# The `dharness` command merged in from .dharness/lefthook.yml runs react-doctor
# over the staged change and then fallow. Three jobs were removed on 2026-08-11
# because they duplicated it: frontend-filesize-warning, frontend-fallow and
# frontend-fallow-dupes. `bun --cwd="frontend" run filesize:warning` still
# exists as a manual command; it is simply no longer part of the gate.
#
# Note what did NOT survive the swap: frontend-fallow-dupes ran
# `fallow dupes --fail-on-regression --tolerance 0` against
# .fallow/baselines/dupes.json. `dharness check` runs `fallow audit`, which
# reads audit.dupesBaseline but is not the same zero-tolerance regression gate.
# Duplication regressions are now reported, not blocked.

extends:
  - .dharness/lefthook.yml

pre-commit:
  parallel: true
  jobs:
    # Cheap checks — seconds each, safe to run together.
    - name: quick
      group:
        parallel: true
        jobs:
          - name: gofmt
            glob: "*.go"
            env: {GOFLAGS: "-p=4", GOMAXPROCS: "4"}
            run: go run ./tools/checkgofmt

          - name: go-filesize
            glob: "*.go"
            env: {GOFLAGS: "-p=4", GOMAXPROCS: "4"}
            run: go run ./tools/checkgofilesize

          - name: architecture
            glob: "*.go"
            env: {GOFLAGS: "-p=4", GOMAXPROCS: "4"}
            run: go run ./tools/checkarchitecture

          # ~2s now that scripts/lint.ps1 caches both linter binaries.
          - name: golangci-lint
            glob:
              - "*.go"
              - "go.mod"
              - "go.sum"
              - ".golangci.yml"
              - ".golangci.dlinter.yml"
              - ".custom-gcl.yml"
              - "lefthook.yml"
              - "scripts/lint.ps1"
            env: {GOMAXPROCS: "4"}
            run: powershell -ExecutionPolicy Bypass -File scripts/lint.ps1 -Profile all

          - name: sdd-gate
            glob:
              - "openspec/**"
              - "*.go"
            env: {GOFLAGS: "-p=4", GOMAXPROCS: "4"}
            run: go run ./tools/checksdd

          - name: openapi
            glob:
              - "*.go"
              - "docs/openapi.yaml"
            env: {GOFLAGS: "-p=4", GOMAXPROCS: "4"}
            run: go run ./tools/checkopenapi

          - name: frontend-typecheck
            glob: "frontend/**"
            run: bun --cwd="frontend" run typecheck

          - name: frontend-lint
            run: bun x eslint {staged_files}
            root: frontend
            glob: "**/*.{js,cjs,mjs,ts,tsx,mts,cts}"

    # Heavy lane 1: the Go module. Piped so vet and the test run never overlap.
    - name: go-heavy
      glob:
        - "*.go"
        - "go.mod"
        - "go.sum"
        # Changing the gate itself re-proves the gate.
        - "lefthook.yml"
        - "scripts/lint.ps1"
      group:
        piped: true
        jobs:
          - name: go-vet
            env: {GOMAXPROCS: "4"}
            run: go vet -p 4 ./...

          - name: go-cover
            env: {GOMAXPROCS: "4"}
            run: go test ./... -cover -p 4 -parallel 4

    # Heavy lane 2: the frontend suite. Runs concurrently with lane 1.
    - name: frontend-heavy
      glob:
        - "frontend/**"
        # Changing the gate itself re-proves the gate.
        - "lefthook.yml"
      group:
        piped: true
        jobs:
          - name: frontend-test
            run: bun --cwd="frontend" run test

          # Renders the real production bundle in headless Edge (the same
          # Chromium engine WebView2 runs) and fails if the app paints nothing.
          # Every other frontend job runs source through Vite in jsdom, so a
          # blank window ships green -- 1.2.0 did exactly that.
          - name: frontend-render-smoke
            run: bun --cwd="frontend" run render:smoke

          # dlinter:owned — managed by `dlinter init`; safe to re-run, do not rename
          - name: test:mutation:staged
            run: npm run test:mutation:staged
            root: frontend
