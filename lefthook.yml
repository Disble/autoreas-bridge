# Local checks share commands and per-process Go limits, not scope.
# Cheap checks run in parallel inside their group; the lanes run one after
# another so the Go and frontend suites never compete for CPU
# (docs/reports/2026-10-18-pre-commit-resource-contention.md).
# No automatic hook inheritance: dharness check is explicit in frontend-heavy.
# Generated ESLint/Fallow config still comes from .dharness/.
# Mutation is a development command and a daily/manual CI audit, not a local gate.

pre-commit:
  piped: true
  jobs:
    - name: quick
      group:
        parallel: true
        jobs:
          - name: gofmt
            glob: "*.go"
            env: &go-limits {GOFLAGS: "-p=4", GOMAXPROCS: "4"}
            run: &gofmt go run ./tools/checkgofmt
          - name: go-filesize
            glob: "*.go"
            env: *go-limits
            run: &go-filesize go run ./tools/checkgofilesize
          - name: architecture
            glob: "*.go"
            env: *go-limits
            run: &architecture go run ./tools/checkarchitecture
          - name: golangci-lint
            glob:
              - "*.go"
              - "go.mod"
              - "go.sum"
              - ".golangci.yml"
              - ".golangci.dlinter.yml"
              - ".custom-gcl.yml"
              - "lefthook.yml"
              - "scripts/lint.ps1"
            env: *go-limits
            run: &golangci-lint powershell -ExecutionPolicy Bypass -File scripts/lint.ps1 -Profile all
          - name: app-icons
            glob:
              - "build/appicon.png"
              - "build/windows/icon.ico"
              - "internal/tray/tray-icon.ico"
              - "tools/genicons/**"
            env: *go-limits
            run: &app-icons go run ./tools/genicons -check
          - name: openapi
            glob:
              - "*.go"
              - "docs/openapi.yaml"
            env: *go-limits
            run: &openapi go run ./tools/checkopenapi

    - name: go-heavy
      glob:
        - "*.go"
        - "go.mod"
        - "go.sum"
        - "lefthook.yml"
        - "scripts/lint.ps1"
      group:
        piped: true
        jobs:
          - name: go-vet
            env: *go-limits
            run: &go-vet go vet -p 4 ./...
          - name: go-cover
            env: *go-limits
            run: &go-cover go test ./... -cover -p 4 -parallel 4

    - name: frontend-heavy
      glob:
        - "frontend/**"
        - ".dharness/**"
        - "lefthook.yml"
      group:
        piped: true
        jobs:
          - name: frontend-quality
            run: bun --cwd="frontend" run check:staged
          - name: frontend-typecheck
            run: &frontend-typecheck bun --cwd="frontend" run typecheck
          # Copied from the coverage job `dharness sync` writes to .dharness/lefthook.yml,
          # which this file does not inherit: native coverage over the adopted tiers.
          # It is the only Vitest run: its config re-exports vite.config.ts, so it runs
          # the whole suite, and a plain `vitest run` beside it would run it twice.
          # No `root:`: lefthook filters staged files by it and would skip the suite on a
          # commit that stages only .dharness/ or lefthook.yml.
          - name: frontend-coverage
            run: &frontend-coverage cd frontend && bunx --no-install vitest run --coverage --config ../.dharness/vitest.coverage.mjs
          - name: frontend-render-smoke
            run: &frontend-render-smoke bun --cwd="frontend" run render:smoke
          - name: frontend-layout-smoke
            run: &frontend-layout-smoke bun --cwd="frontend" run layout:smoke

# A merge judges the whole tree, so no jobs or groups here have file globs.
# Staged quality is omitted: repository JSDoc adoption is incremental.
# Typecheck precedes tests in this lane too, avoiding the old merge contention.
# The lanes run one after another, as in pre-commit, so the suites never compete for CPU.
pre-merge-commit:
  piped: true
  jobs:
    - name: quick
      group:
        parallel: true
        jobs:
          - name: gofmt
            env: *go-limits
            run: *gofmt
          - name: go-filesize
            env: *go-limits
            run: *go-filesize
          - name: architecture
            env: *go-limits
            run: *architecture
          - name: golangci-lint
            env: *go-limits
            run: *golangci-lint
          - name: openapi
            env: *go-limits
            run: *openapi
          - name: app-icons
            env: *go-limits
            run: *app-icons
    - name: go-heavy
      group:
        piped: true
        jobs:
          - name: go-vet
            env: *go-limits
            run: *go-vet
          - name: go-cover
            env: *go-limits
            run: *go-cover
    - name: frontend-heavy
      group:
        piped: true
        jobs:
          - name: frontend-typecheck
            run: *frontend-typecheck
          - name: frontend-coverage
            run: *frontend-coverage
          - name: frontend-render-smoke
            run: *frontend-render-smoke
          - name: frontend-layout-smoke
            run: *frontend-layout-smoke
