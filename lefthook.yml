pre-commit:
  parallel: true
  jobs:
    - name: frontend-fallow
      run: bun --cwd="frontend" run fallow audit --quiet

    - name: frontend-filesize-warning
      run: bun --cwd="frontend" run filesize:warning

    - name: frontend-lint
      run: bun --cwd="frontend" run lint

    - name: frontend-typecheck
      run: bun --cwd="frontend" run typecheck

    - name: frontend-test
      run: bun --cwd="frontend" run test

    - name: gofmt
      run: go run ./tools/checkgofmt

    - name: go-filesize
      run: go run ./tools/checkgofilesize

    - name: architecture
      run: go run ./tools/checkarchitecture

    - name: golangci-lint
      run: golangci-lint run

    - name: go-vet
      run: go vet ./...

    - name: go-cover
      run: go test ./... -cover

    - name: sdd-gate
      run: go run ./tools/checksdd

    - name: openapi
      run: go run ./tools/checkopenapi
