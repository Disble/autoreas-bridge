pre-commit:
  parallel: false
  jobs:
    - name: frontend-lint
      run: bun --cwd="frontend" run lint

    - name: frontend-typecheck
      run: bun --cwd="frontend" run typecheck

    - name: frontend-test
      run: bun --cwd="frontend" run test

    - name: gofmt
      run: go run ./tools/checkgofmt

    - name: go-filesize
      run: go run ./tools/checkgofilesize

    - name: golangci-lint
      run: golangci-lint run

    - name: go-vet
      run: go vet ./...

    - name: go-test
      run: go test ./...

    - name: go-cover
      run: go test ./... -cover

    - name: sdd-gate
      run: go run ./tools/checksdd

    - name: openapi
      run: go run ./tools/checkopenapi
