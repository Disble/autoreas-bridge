# Debian package definition, consumed by `nfpm pkg` in build-linux.yml.
#
# Why a .deb and not just the tarball: the tarball ships a bare ELF, so a user
# on a distro without WebKitGTK 4.1 hits
# `libwebkit2gtk-4.1.so.0: cannot open shared object file` and has no way to
# know what to install. A package DECLARES that dependency, so apt resolves it.
# It also lands a .desktop entry, an icon and AppStream metadata, which is the
# shape Bridge is meant to have -- an installed application, not a loose binary.
#
# Everything the desktop and the software store look up shares one reverse-DNS
# id, `io.github.disble.autoreas-bridge`: the .desktop file name, the icon name,
# and the AppStream component id. Only the executable keeps the short name,
# because that is what a user types.
#
# ${VERSION} is expanded from the environment by nfpm; the workflow sets it from
# wails.json -> info.productVersion, which stays the single source of the version.
name: autoreas-bridge
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: disble <contact@disble.com>
homepage: https://github.com/Disble/autoreas-bridge
description: |
  Desktop companion for tracking and downloading anime.
  Bridge keeps a local catalogue, schedules episode checks, drives downloads
  through JDownloader, and exposes a REST/WebSocket API for paired mobile
  devices.

# No `license:` field on purpose: the repository carries no LICENSE file, and
# declaring one that is not in the tree would be an unverifiable claim.

depends:
  # `libgtk-3-0` was renamed `libgtk-3-0t64` in Ubuntu 24.04 by the 64-bit
  # time_t transition. A Debian alternative satisfies both, so one package
  # installs on 22.04 and on 24.04 rather than needing two builds.
  - libgtk-3-0 | libgtk-3-0t64
  # libsoup3 and libjavascriptcoregtk-4.1 are deliberately NOT listed: they are
  # what makes WebKitGTK "4.1" rather than "4.0", so this package pulls them in
  # transitively. Listing them again would be a second place to keep in sync.
  - libwebkit2gtk-4.1-0

contents:
  - src: ./build/bin/autoreas-bridge
    dst: /usr/bin/autoreas-bridge
    file_info:
      mode: 0755

  - src: ./build/linux/io.github.disble.autoreas-bridge.desktop
    dst: /usr/share/applications/io.github.disble.autoreas-bridge.desktop

  # Rendered from build/linux/io.github.disble.autoreas-bridge.metainfo.xml.in
  # by the workflow, which substitutes the version. This is what a software
  # store reads to build its listing.
  - src: ./build/linux/generated/io.github.disble.autoreas-bridge.metainfo.xml
    dst: /usr/share/metainfo/io.github.disble.autoreas-bridge.metainfo.xml

  # The icon goes into the hicolor THEME, not /usr/share/pixmaps.
  #
  # 1.8.2 installed a single 1024x1024 PNG into pixmaps and the store still drew
  # a generic package icon. pixmaps is a legacy path the desktop shell searches,
  # which is why the applications menu looked right, but an AppStream
  # `type="stock"` icon is resolved against the icon stock -- so the store found
  # nothing. build/appicon.png is resized into these standard sizes by the
  # workflow; 1024 is not one of them, which is what sent it to pixmaps
  # originally.
  - src: ./build/linux/generated/icons/48x48/apps/io.github.disble.autoreas-bridge.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.disble.autoreas-bridge.png
  - src: ./build/linux/generated/icons/64x64/apps/io.github.disble.autoreas-bridge.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.disble.autoreas-bridge.png
  - src: ./build/linux/generated/icons/128x128/apps/io.github.disble.autoreas-bridge.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.disble.autoreas-bridge.png
  - src: ./build/linux/generated/icons/256x256/apps/io.github.disble.autoreas-bridge.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.disble.autoreas-bridge.png
  - src: ./build/linux/generated/icons/512x512/apps/io.github.disble.autoreas-bridge.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.disble.autoreas-bridge.png

scripts:
  # The icon theme and the desktop database are indexed caches. Without a
  # refresh the files are on disk and nothing looks at them until the next
  # login, which reads as "the package installed but the icon is still wrong".
  postinstall: ./build/linux/postinstall.sh
  postremove: ./build/linux/postinstall.sh
