<!doctype html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity — feed concept</title>
<link rel="stylesheet" href="assets/bridge/app.css">
<style>
  :root {
    --bg: oklch(12% .005 285.823);
    --fg: oklch(99.11% 0 0);
    --surface: oklch(21.03% .0059 285.89);
    --surface-2: oklch(25.7% .0037 286.14);
    --default: oklch(27.4% .006 286.033);
    --muted: oklch(70.5% .015 286.067);
    --border: oklch(28% .006 286.033);
    --sep: oklch(25% .006 286.033);
    --accent: oklch(62.04% .195 253.83);
    --success: oklch(73.29% .1935 150.81);
    --warning: oklch(82.03% .1388 76.34);
    --danger: oklch(59.4% .1967 24.63);
    --r: .5rem;
  }
  body { background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, sans-serif; }
  .ax-shell { display: flex; min-height: 100vh; }
  .ax-main { flex: 1; min-width: 0; padding: 40px 48px 64px; display: flex; flex-direction: column; gap: 20px; }
  .ax-head { display: flex; align-items: flex-start; justify-content: space-between; }
  .ax-h1 { font-size: 2.25rem; font-weight: 600; letter-spacing: -.02em; }

  /* icon button + tooltip */
  .ax-ib { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 999px;
    background: var(--default); color: var(--fg); transition: background .15s, transform .1s; }
  .ax-ib:hover { background: color-mix(in oklab, var(--default) 85%, var(--fg) 15%); }
  .ax-ib:active { transform: scale(.96); }
  .ax-ib.sm { width: 28px; height: 28px; background: transparent; color: var(--muted); }
  .ax-ib.sm:hover { background: var(--default); color: var(--fg); }
  .ax-ib svg, .ax-ic svg { width: 18px; height: 18px; }
  [data-tip] { position: relative; }
  [data-tip]::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); translate: -50% 4px;
    white-space: nowrap; background: var(--surface-2); color: var(--fg); font-size: 12px; font-weight: 500; padding: 5px 9px;
    border-radius: 8px; box-shadow: 0 0 1px 0 #ffffff4d inset, 0 8px 24px #0008; opacity: 0; pointer-events: none;
    transition: opacity .12s, translate .12s; z-index: 40; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; translate: -50% 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ax-card { background: var(--surface); border-radius: 1.5rem; padding: 20px 24px; }

  /* time bar */
  .ax-time-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .ax-label { font-size: 14px; color: var(--muted); }
  .ax-range { display: inline-flex; background: var(--default); border-radius: 999px; padding: 3px; }
  .ax-range button { font-size: 12px; padding: 3px 12px; border-radius: 999px; color: var(--muted); }
  .ax-range button[aria-pressed="true"] { background: oklch(39.64% .01 285.93); color: var(--fg); }
  .ax-bars { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 4px; align-items: end; height: 96px; }
  .ax-bar { position: relative; height: 100%; display: flex; align-items: flex-end; border-radius: 6px; cursor: pointer; }
  .ax-bar:hover { background: color-mix(in oklab, var(--surface) 80%, var(--fg) 6%); }
  .ax-bar .fill { width: 100%; background: color-mix(in oklab, var(--accent) 75%, var(--bg)); border-radius: 5px; min-height: 3px; position: relative; overflow: hidden; }
  .ax-bar .fail { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--danger); }
  .ax-bar.off { cursor: default; }
  .ax-bar.off .fill { height: 100% !important; background: repeating-linear-gradient(-45deg, transparent 0 5px, color-mix(in oklab, var(--muted) 22%, transparent) 5px 6px);
    outline: 1px dashed color-mix(in oklab, var(--muted) 45%, transparent); outline-offset: -1px; }
  .ax-bar.sel .fill { background: var(--accent); }
  .ax-bar.dim .fill { opacity: .35; }
  .ax-bar.now::before { content: ""; position: absolute; right: -3px; top: -6px; bottom: -6px; width: 2px; background: var(--success); border-radius: 2px; }
  .ax-hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 4px; margin-top: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ax-hours span { text-align: center; }
  .ax-hours span.day { color: var(--fg); }
  .ax-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .ax-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  /* body: feed + panel */
  .ax-body { display: block; }
  .ax-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--sep); }
  .ax-search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: .75rem; background: var(--default); color: var(--muted); flex: 1 1 220px; min-width: 0; max-width: 360px; }
  .ax-search svg { width: 16px; height: 16px; flex: none; }
  .ax-search input { background: transparent; outline: none; color: var(--fg); font-size: 14px; width: 100%; }
  .ax-search input::placeholder { color: var(--muted); }
  .ax-seg { display: inline-flex; background: var(--default); border-radius: .75rem; padding: 3px; gap: 2px; }
  .ax-seg button { height: 30px; min-width: 30px; padding: 0 10px; border-radius: .6rem; font-size: 13px; color: var(--muted); display: inline-grid; place-items: center; grid-auto-flow: column; gap: 6px; }
  .ax-seg button:hover { color: var(--fg); }
  .ax-seg button[aria-pressed="true"] { background: oklch(39.64% .01 285.93); color: var(--fg); }
  .ax-seg svg { width: 16px; height: 16px; }
  .ax-spacer { flex: 1; }
  .ax-what { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
  /* a very narrow window scrolls the type control itself, never the whole page */
  .ax-what > .ax-seg { max-width: 100%; overflow-x: auto; }
  .ax-failbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 500;
    background: color-mix(in oklab, var(--danger) 18%, transparent); color: color-mix(in oklab, var(--danger) 70%, var(--fg)); }
  .ax-failbtn svg { width: 16px; height: 16px; }
  .ax-failbtn[aria-pressed="true"] { background: var(--danger); color: var(--fg); }
  .ax-active { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 12px; }
  .ax-active:empty { display: none; }
  .ax-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 6px 3px 10px; border-radius: 999px; background: color-mix(in oklab, var(--accent) 20%, transparent); color: color-mix(in oklab, var(--accent) 55%, var(--fg)); }
  .ax-pill button { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 999px; }
  .ax-pill button:hover { background: #ffffff1a; }

  .ax-day { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 16px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .ax-row { display: grid; grid-template-columns: 52px 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 48px; padding: 6px 8px; margin: 0 -8px; border-radius: .75rem; }
  .ax-row.open { cursor: pointer; }
  .ax-row:hover { background: color-mix(in oklab, var(--surface) 88%, var(--fg) 6%); }
  .ax-row + .ax-row { box-shadow: 0 -1px 0 var(--sep); }
  .ax-t { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ax-ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--default); color: var(--muted); }
  .ax-ic.fail { background: color-mix(in oklab, var(--danger) 22%, transparent); color: color-mix(in oklab, var(--danger) 70%, var(--fg)); }
  .ax-ic.slow { background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); }
  .ax-line { min-width: 0; font-size: 14px; display: flex; flex-wrap: wrap; column-gap: 8px; row-gap: 2px; }
  .ax-line b { font-weight: 500; color: var(--fg); }
  .ax-line span { color: var(--muted); }
  .ax-line .bad { color: color-mix(in oklab, var(--danger) 65%, var(--fg)); }
  .ax-end { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .ax-count { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--default); color: var(--muted); font-variant-numeric: tabular-nums; }
  .ax-chev { width: 18px; height: 18px; }
  .ax-gap { display: flex; align-items: center; gap: 10px; margin: 6px 0; padding: 12px 14px; border-radius: .75rem; border: 1px dashed color-mix(in oklab, var(--muted) 45%, transparent); font-size: 13px; color: var(--muted); }
  .ax-gap svg { width: 18px; height: 18px; }
  .ax-empty { padding: 48px 0; text-align: center; color: var(--muted); font-size: 14px; }

  /* side panel */
  .ax-panel { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  .ax-panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); padding: 2px 6px 6px; }
  .ax-area { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px; border-radius: 1rem; transition: background .15s; }
  .ax-area:hover { background: color-mix(in oklab, var(--surface) 88%, var(--fg) 6%); }
  .ax-area[aria-pressed="true"] { background: color-mix(in oklab, var(--accent) 16%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent); }
  .ax-area .ax-ic { width: 36px; height: 36px; border-radius: 10px; }
  .ax-area .name { font-size: 14px; font-weight: 500; }
  .ax-area .val { font-size: 12px; color: var(--muted); }
  .ax-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--success); }
  .ax-dot.warn { background: var(--warning); } .ax-dot.bad { background: var(--danger); }

  .ax-toast { position: fixed; right: 24px; bottom: 24px; background: var(--surface-2); border-radius: 1rem; padding: 12px 16px; font-size: 14px;
    box-shadow: 0 0 1px 0 #ffffff4d inset, 0 12px 32px #000a; display: flex; gap: 10px; align-items: center; translate: 0 12px; opacity: 0; transition: .2s; pointer-events: none; }
  .ax-toast.show { translate: 0 0; opacity: 1; }
  .ax-toast svg { width: 18px; height: 18px; color: var(--success); }

  /* range selection on the chart */
  .ax-bars { user-select: none; touch-action: none; }
  .ax-bar.off { cursor: crosshair; }
  .ax-bars.dragging .ax-bar { cursor: ew-resize; }
  .ax-bar.sel { background: color-mix(in oklab, var(--accent) 14%, transparent); }
  .ax-bar.sel.edge-l { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
  .ax-bars.dragging [data-tip]::after { opacity: 0 !important; }
  .ax-hours.days span { color: var(--muted); }

  /* date range field */
  .ax-dr-wrap { position: relative; }
  .ax-dr { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: .75rem; background: var(--default);
    color: var(--muted); font-size: 14px; min-width: 250px; }
  .ax-dr:hover { background: color-mix(in oklab, var(--default) 85%, var(--fg) 10%); }
  .ax-dr svg { width: 16px; height: 16px; flex: none; }
  .ax-dr .v { color: var(--fg); font-variant-numeric: tabular-nums; }
  .ax-dr .ph { color: var(--muted); }
  .ax-pop { position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; width: 320px; padding: 14px; border-radius: 1.25rem;
    background: var(--surface-2); box-shadow: 0 0 1px 0 #ffffff4d inset, 0 16px 40px #000c; display: none; }
  .ax-pop.open { display: block; }
  .ax-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  .ax-cal-head .ax-ib { width: 28px; height: 28px; background: transparent; }
  .ax-cal-head .ax-ib:hover { background: var(--default); }
  .ax-cal-head .ax-ib[disabled] { opacity: .3; pointer-events: none; }
  .ax-cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
  .ax-cal .wd { font-size: 11px; color: var(--muted); padding: 4px 0; }
  .ax-cal button { height: 34px; font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; position: relative; }
  .ax-cal button span { display: grid; place-items: center; width: 34px; height: 34px; margin: auto; border-radius: 999px; }
  .ax-cal button:hover span { background: var(--default); }
  .ax-cal button[disabled] { color: color-mix(in oklab, var(--muted) 45%, transparent); pointer-events: none; }
  .ax-cal button.in { background: color-mix(in oklab, var(--accent) 22%, transparent); }
  .ax-cal button.start { border-radius: 999px 0 0 999px; }
  .ax-cal button.end { border-radius: 0 999px 999px 0; }
  .ax-cal button.start.end { border-radius: 999px; }
  .ax-cal button.start span, .ax-cal button.end span { background: var(--accent); color: var(--fg); }
  .ax-cal button.today span { box-shadow: inset 0 0 0 1px var(--muted); }
  .ax-times { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .ax-times label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .ax-times input { height: 34px; padding: 0 10px; border-radius: .6rem; background: var(--default); color: var(--fg); font-size: 14px;
    color-scheme: dark; font-variant-numeric: tabular-nums; outline: none; }
  .ax-times input:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .ax-pop-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .ax-btn { height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--default); color: var(--fg); }
  .ax-btn:hover { background: color-mix(in oklab, var(--default) 85%, var(--fg) 12%); }
  .ax-btn.primary { background: var(--accent); }
  .ax-btn.primary:hover { background: color-mix(in oklab, var(--accent) 90%, var(--fg) 10%); }
  .ax-btn[disabled] { opacity: .4; pointer-events: none; }

  /* dense day bars for 30 and 90 days */
  .ax-bars.dense, .ax-hours.dense { gap: 2px; }
  .ax-bars.dense .ax-bar, .ax-bars.dense .ax-bar .fill { border-radius: 3px; }
  .ax-hours span { white-space: nowrap; overflow: visible; }
  .ax-hours.dense span { text-align: left; }

  /* phone status, counts in filters, clear inside the range field */
  .ax-status { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); width: max-content; }
  .ax-n { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 6px; border-radius: 999px; background: color-mix(in oklab, var(--bg) 40%, transparent); }
  .ax-n:empty { display: none; }
  .ax-seg button[aria-pressed="true"] .ax-n { color: var(--fg); }
  .ax-dr { padding-right: 36px; }
  .ax-dr-clear { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 999px; color: var(--muted); }
  .ax-dr-clear:hover { background: #ffffff1a; color: var(--fg); }
  .ax-dr-clear svg { width: 14px; height: 14px; }
  .ax-dr-clear[hidden] { display: none; }

  /* independent type toggles, red mark per type, expanding failure button */
  .ax-fmark { font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 999px; color: color-mix(in oklab, var(--danger) 70%, var(--fg)); background: color-mix(in oklab, var(--danger) 22%, transparent); }
  .ax-seg.muted { opacity: .45; }
  /* failure button grows into a dropdown-style container anchored to its top-right corner */
  .ax-failgrp { position: relative; flex: none; }
  .ax-failgrp .ax-failbtn { position: relative; z-index: 31; }
  .ax-failpop { position: absolute; top: -6px; right: -6px; z-index: 30; width: 236px; padding: 48px 6px 6px; border-radius: 1rem;
    background: var(--surface-2); box-shadow: 0 0 0 1px #ffffff12, 0 12px 32px -6px #000000b3, 0 4px 12px -4px #00000080;
    clip-path: inset(0 0 calc(100% - 48px) calc(100% - var(--bw, 60px) - 12px) round 24px); opacity: 0; visibility: hidden;
    transition: clip-path .2s cubic-bezier(.2, 0, 0, 1), opacity .12s ease-out, visibility 0s linear .2s; }
  .ax-failgrp.open .ax-failpop { clip-path: inset(0 0 0 0 round 1rem); opacity: 1; visibility: visible;
    transition: clip-path .2s cubic-bezier(.2, 0, 0, 1), opacity .08s ease-out, visibility 0s; }
  .ax-failpop [role="menu"] { display: flex; flex-direction: column; gap: 2px; }
  .ax-failgrp.open .ax-failbtn, .ax-failgrp.open .ax-failbtn[aria-pressed="true"] { background: color-mix(in oklab, var(--danger) 18%, transparent); color: color-mix(in oklab, var(--danger) 70%, var(--fg)); }
  .ax-failbtn { transition: background .2s, color .2s; }
  .ax-failhd { position: absolute; top: 6px; left: 16px; height: 36px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
  .ax-failrow { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
    border-radius: .6rem; font-size: 14px; color: var(--fg); text-align: left; }
  .ax-failrow:hover, .ax-failrow:focus-visible { background: var(--default); outline: none; }
  .ax-failrow svg { width: 16px; height: 16px; color: var(--muted); }
  .ax-failrow[aria-checked="true"] { background: var(--default); }
  .ax-failrow[aria-checked="true"]:hover, .ax-failrow[aria-checked="true"]:focus-visible { background: color-mix(in oklab, var(--default) 85%, var(--fg) 8%); }
  .ax-failrow[aria-checked="true"] svg { color: var(--fg); }
  .ax-failrow[aria-checked="false"] { color: var(--muted); }
  .ax-failrow[aria-checked="false"] .n { color: var(--muted); background: var(--default); }
  .ax-failrow .n { font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 999px;
    color: color-mix(in oklab, var(--danger) 70%, var(--fg)); background: color-mix(in oklab, var(--danger) 22%, transparent); }
  .ax-failrow[aria-disabled="true"] { opacity: .5; pointer-events: none; cursor: default; background: none; }
  .ax-failrow[aria-disabled="true"] .n { color: var(--muted); background: var(--default); }
  /* while the failure filter is on, an × inside the button turns it off (same as the date field's clear) */
  .ax-failbtn[aria-pressed="true"] { padding-right: 36px; }
  .ax-failx { position: absolute; right: 6px; top: 6px; z-index: 32; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 999px; color: inherit; }
  .ax-failx svg { width: 14px; height: 14px; }
  .ax-failx:hover { background: #ffffff26; }
  .ax-failx[hidden] { display: none; }
  .ax-failbtn[aria-pressed="true"] ~ .ax-failx { color: var(--fg); }
  .ax-failgrp.open .ax-failx { color: color-mix(in oklab, var(--danger) 70%, var(--fg)); }
  @media (prefers-reduced-motion: reduce) { .ax-failpop, .ax-failgrp.open .ax-failpop { transition: none; } }

  /* detail drawer: HeroUI Drawer, placement right (w-96, p-6, overlay surface, no rounding) */
  .ax-row.sel { background: var(--default); }
  .ax-dw { position: fixed; top: 0; right: 0; z-index: 50; width: 384px; max-width: 85vw; height: 100vh; display: flex; flex-direction: column; gap: 20px;
    padding: 24px; background: var(--surface); box-shadow: 0 0 1px 0 #ffffff4d inset, -16px 0 40px -12px #000000b3;
    translate: 100% 0; visibility: hidden; transition: translate .25s cubic-bezier(.32, .72, 0, 1), visibility 0s linear .25s; }
  .ax-dw.open { translate: 0 0; visibility: visible; transition: translate .25s cubic-bezier(.32, .72, 0, 1), visibility 0s; }
  .ax-dw.open { transition: translate .25s cubic-bezier(.32, .72, 0, 1), width .25s cubic-bezier(.32, .72, 0, 1), visibility 0s; }
  .ax-dw.wide { width: 720px; }
  @media (prefers-reduced-motion: reduce) { .ax-dw, .ax-dw.open { transition: none; } }

  /* technical view */
  .ax-dw .ax-seg { align-self: flex-start; }
  .ax-mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .ax-reqs { display: flex; flex-direction: column; gap: 2px; }
  .ax-req { display: grid; grid-template-columns: minmax(0, 1fr) auto 32px 44px; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: .6rem; text-align: left; font-size: 13px; color: var(--fg); }
  .ax-req:hover { background: var(--default); }
  .ax-req[aria-selected="true"] { background: var(--default); }
  .ax-req .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ax-req .p span { color: var(--muted); margin-right: 6px; }
  .ax-req .t { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .ax-code-chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums;
    background: color-mix(in oklab, var(--success) 18%, transparent); color: var(--success); }
  .ax-code-chip.bad { background: color-mix(in oklab, var(--danger) 22%, transparent); color: color-mix(in oklab, var(--danger) 70%, var(--fg)); }
  .ax-req .ax-count { justify-self: end; }
  .ax-req .st { display: flex; gap: 6px; justify-self: end; }
  .ax-reqs + .ax-rq-panel { margin-top: 4px; }
  .ax-rq-panel { border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; }
  .ax-rq-panel .ax-rq { padding: 16px; }
  .ax-rq-sum { padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); min-height: 48px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--muted); }
  .ax-rq-sum b { color: var(--fg); font-weight: 500; }
  .ax-rq { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ax-rq > div { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .ax-rq h4 { font-size: 13px; font-weight: 500; color: var(--fg); display: flex; align-items: center; gap: 8px; }
  .ax-hdrs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 12px; }
  .ax-hdrs dt { color: var(--muted); white-space: nowrap; }
  .ax-hdrs dd { color: var(--fg); overflow-wrap: anywhere; }
  .ax-code { font-size: 12px; line-height: 1.55; padding: 12px 14px; border-radius: .75rem; background: var(--bg); color: var(--fg); overflow: auto; max-height: 300px; white-space: pre; }
  .ax-code .k { color: color-mix(in oklab, var(--accent) 60%, var(--fg)); }
  .ax-code .s { color: color-mix(in oklab, var(--success) 70%, var(--fg)); }
  .ax-trunc { font-size: 11px; font-weight: 400; padding: 1px 7px; border-radius: 999px; background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); }
  .ax-tech-empty { display: grid; place-items: center; gap: 8px; text-align: center; padding: 40px 16px; font-size: 14px; color: var(--muted); }
  .ax-tech-empty svg { width: 28px; height: 28px; }
  .ax-tech-empty b { color: var(--fg); font-weight: 500; }
  .ax-evs li { display: grid; grid-template-columns: 64px 52px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: 13px; align-items: baseline; }
  .ax-evs li + li { box-shadow: 0 -1px 0 var(--sep); }
  .ax-evs .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ax-lvl { font-size: 11px; padding: 1px 6px; border-radius: 999px; text-align: center; background: var(--default); color: var(--muted); }
  .ax-lvl.error { background: color-mix(in oklab, var(--danger) 22%, transparent); color: color-mix(in oklab, var(--danger) 70%, var(--fg)); }
  .ax-lvl.warn { background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); }
  .ax-evs small { display: block; color: var(--muted); font-size: 12px; }
  .ax-dw-head { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
  .ax-dw-head .ax-ic { margin-top: 2px; }
  .ax-dw-title { font-size: 16px; font-weight: 500; color: var(--fg); line-height: 1.3; }
  .ax-dw-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .ax-dw-sub.bad { color: color-mix(in oklab, var(--danger) 65%, var(--fg)); }
  .ax-dw-meta { font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ax-dw-acts { display: flex; gap: 2px; margin: -4px -8px 0 0; }
  .ax-dw-acts [data-tip]::after { bottom: auto; top: calc(100% + 8px); }
  /* inside the drawer, tooltips grow leftwards from their element's right edge so they never widen the panel */
  .ax-dw-acts [data-tip]::after, .ax-dw-body [data-tip]::after { left: auto; right: 0; translate: 0 4px; }
  .ax-dw-acts [data-tip]:hover::after, .ax-dw-acts [data-tip]:focus-visible::after,
  .ax-dw-body [data-tip]:hover::after, .ax-dw-body [data-tip]:focus-visible::after { translate: 0 0; }
  .ax-dw-body { flex: 1; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 20px; margin: 0 -24px; padding: 0 24px 8px; }
  .ax-dw-keys { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .ax-dw-keys kbd { font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--default); color: var(--fg); }
  .ax-sec h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
  .ax-ba { display: grid; grid-template-columns: 1fr 20px 1fr; align-items: center; gap: 8px; }
  .ax-ba > div { padding: 12px 14px; border-radius: .75rem; background: var(--default); min-width: 0; }
  .ax-ba small { display: block; font-size: 12px; color: var(--muted); }
  .ax-ba b { display: block; font-size: 20px; font-weight: 500; color: var(--fg); margin-top: 2px; overflow-wrap: anywhere; }
  .ax-ba .no b { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .ax-ba > svg { width: 18px; height: 18px; color: var(--muted); }
  .ax-cause { padding: 12px 14px; border-radius: .75rem; font-size: 14px; color: var(--fg); line-height: 1.45;
    background: color-mix(in oklab, var(--danger) 12%, transparent); }
  .ax-cause .code { display: inline-block; margin-top: 8px; font-size: 12px; padding: 1px 8px; border-radius: 999px;
    background: color-mix(in oklab, var(--fg) 8%, transparent); color: var(--muted); }
  .ax-cause small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .ax-cause.raw p { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .ax-nopres { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); padding: 8px 12px; border-radius: .75rem;
    box-shadow: inset 0 0 0 1px var(--sep); margin-bottom: 12px; }
  .ax-nopres svg { width: 14px; height: 14px; flex: none; }
  .ax-nopres code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--fg); }
  .ax-facts dd.ax-mono { font-size: 13px; overflow-wrap: anywhere; }
  .ax-facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; }
  .ax-facts dt { color: var(--muted); }
  .ax-facts dd { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }
  .ax-late { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 6px;
    background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); }
  .ax-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ax-stats div { padding: 10px 12px; border-radius: .75rem; background: var(--default); }
  .ax-stats b { display: block; font-size: 20px; font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
  .ax-stats small { font-size: 12px; color: var(--muted); }
  .ax-stats .bad b { color: color-mix(in oklab, var(--danger) 65%, var(--fg)); }
  .ax-list { display: flex; flex-direction: column; }
  .ax-list li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: 14px; color: var(--fg); }
  .ax-list li + li { box-shadow: 0 -1px 0 var(--sep); }
  .ax-list .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ax-list .m { color: var(--muted); }
  .ax-list .bad { color: color-mix(in oklab, var(--danger) 65%, var(--fg)); }
  .ax-note { font-size: 12px; color: var(--muted); }
  .ax-steps { display: flex; flex-direction: column; }
  .ax-steps li { position: relative; display: grid; grid-template-columns: 44px 14px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; font-size: 14px; }
  .ax-steps li::before { content: ""; position: absolute; left: 60px; top: 14px; bottom: -2px; width: 2px; background: var(--sep); }
  .ax-steps li:last-child::before { display: none; }
  .ax-steps .t { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ax-steps i { width: 10px; height: 10px; margin: 5px 0 0 2px; border-radius: 999px; background: var(--muted); }
  .ax-steps .ok i { background: var(--success); }
  .ax-steps .bad i { background: var(--danger); }
  .ax-steps .bad span:last-child { color: color-mix(in oklab, var(--danger) 65%, var(--fg)); }
  .ax-steps small { display: block; color: var(--muted); font-size: 13px; }

  /* progressive feed */
  .ax-skel { display: grid; grid-template-columns: 52px 28px minmax(0, 1fr); align-items: center; gap: 10px; min-height: 48px; }
  .ax-skel i { display: block; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--default) 25%, color-mix(in oklab, var(--default) 80%, var(--fg) 10%) 50%, var(--default) 75%);
    background-size: 200% 100%; animation: ax-shimmer 1.2s linear infinite; }
  .ax-skel i.box { width: 28px; height: 28px; border-radius: 8px; }
  @keyframes ax-shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .ax-skel i { animation: none; } }
  .ax-end-mark { display: flex; align-items: center; gap: 12px; padding: 20px 0 4px; font-size: 12px; color: var(--muted); }
  .ax-end-mark::before, .ax-end-mark::after { content: ""; flex: 1; height: 1px; background: var(--sep); }
</style>

function slotsFor(mode) {
  if (mode === '24h') {

    return Array.from({ length: 24 }, (_, i) => {
      const from = first + i * H, h = new Date(from).getHours(), d = from < dayStart(0) ? -1 : 0;
      return { from, to: from + H, v: HVOL[h] || 0, off: d === 0 && h >= 3 && h <= 7, label: h === 0 ? 'Today' : h % 3 === 0 ? pad(h) : '', strong: h === 0, tip: `${pad(h)}:00` };

function match(e) {
  const sc = scope();
  if (e.gap) return !st.fails && overlaps({ from: e.at, to: e.to }, sc);
  if (e.at < sc.from || e.at > sc.to) return false;
  if (st.origin !== 'all' && e.o !== st.origin) return false;
  // the failure view shows failures of the chosen types, whatever the type filters say
  if (st.fails) return !!e.fail && st.failKinds.has(e.k);
  // bridge start and stop mark when data exists, so no type filter hides them
  return e.k === 'life' || st.kinds.has(e.k);
}

function row(e) {
  if (e.gap) return `<div class="ax-gap">${svg('power')}<span>${e.s}</span></div>`;
  const icCls = e.fail ? 'ax-ic fail' : e.slow ? 'ax-ic slow' : 'ax-ic';

    e.n ? `<span class="ax-count" data-tip="${e.n} times">×${e.n}</span>` : '',
    e.fail ? `<button class="ax-ib sm" data-copy="1" data-tip="Copy for AI" aria-label="Copy for AI">${svg('copy')}</button>` : '',

    <span class="ax-end">${end}</span></div>`;
}

const VIEWS = { change: changeView, traffic: trafficView, download: runView, task: taskView, edit: editView,
  life: e => e.a.startsWith('Bridge st') ? lifeView(e) : bridgeView(e) };
const viewOf = e => e.et ? genericView : VIEWS[e.k];
// what the summary could not translate, said once at the top of the technical view
function gapsOf(e) {
  const out = [];
  if (e.et) out.push(`No presenter for <code>${e.et}</code>. Shown with the generic layout.`);
  if (e.k === 'traffic' && e.fail) out.push(`The 401 carried no error code, only a message. It is shown as recorded.`);
  if (e.k === 'change' && e.fail && !CAUSES[errOf(e).code]) out.push(`No catalog entry for <code>${errOf(e).code}</code>. The recorded message is shown as is.`);
  return out.map(t => `<p class="ax-nopres">${svg('code')}<span>${t}</span></p>`).join('');
}

// ---- technical view: recorded requests, runtime events and raw data ----
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const json = o => esc(JSON.stringify(o, null, 2)).replace(/(&quot;|")([^"]+)"(?=:)/g, '<span class="k">"$2"</span>').replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>');
const iso = ms => new Date(ms).toISOString();
const sec2 = (ms, s = 0) => `${hm(ms)}:${pad(s)}`;
const PHONE_HDRS = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ••••••••', 'User-Agent': 'AutoreasMobile/2.4.1 (Android 15)', 'X-Client-Request-Id': '' };
function requestsOf(e) {
  if (e.o !== 'phone') return null;
  const kept = e.fail || e.at >= NOW - 2 * H;
  if (!kept) return [];
  const aid = a => 'J' + [...a].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36).padEnd(15, 'q').slice(0, 15);
  const reconcileRes = (ops, at) => ({ status: 'ok', last_changelog_id: 1842, applied_operations: ops, bridge_changes: [], conflicts: [], season_mode: true });
  if (e.k === 'traffic') {
    const total = +e.s.match(/^(\d+)/)[1], refused = e.fail ? 1 : 0;
    const out = [{ m: 'POST', p: '/api/sync/reconcile', code: 200, n: total - refused, at: Math.min(NOW - MIN, e.at + 52 * MIN), ms: 412,
      req: { device_id: 'pixel-8a', last_changelog_id: 1842, pending_operations: [] }, res: reconcileRes([]) }];
    if (refused) out.unshift({ m: 'POST', p: '/api/sync/reconcile', code: 401, n: 1, at: e.at + 14 * MIN, ms: 38,
      req: { device_id: 'pixel-8a', last_changelog_id: 1842, pending_operations: [] }, res: { error: AUTH_ERR.msg } });
    return out;
  }
  if (e.k === 'change') {
    // a phone change rides reconcile as a pending operation; a rejection is applied:false inside a 200
    const x = CHANGE_X[`${e.a}|${e.t}`] || {}, field = (x.field || 'Episode').toLowerCase(), tries = e.fail ? (x.tries || [0, 0]).length : 1;
    const key = { episode: 'episodes_watched', grade: 'grade', state: 'status' }[field] || field;
    const op = { anime_id: aid(e.a), operation: 'update', payload: { [key]: isNaN(x.to ?? 1) ? x.to : +(x.to ?? 1) }, created_at: x.phoneAt ?? e.at - MIN };
    const applied = { anime_id: op.anime_id, operation: 'update', applied: !e.fail, modified_at: e.at - 3 * H, ...(e.fail ? { reason: errOf(e).code } : {}) };
    const out = [{ m: 'POST', p: '/api/sync/reconcile', code: 200, n: tries, at: e.at, ms: e.fail ? 71 : 96, notApplied: !!e.fail,
      req: { device_id: 'pixel-8a', last_changelog_id: 1842, pending_operations: [op] }, res: reconcileRes([applied]) }];
    // the phone also reports each sync cycle, and each episode button press, to the diagnostics store
    const episode = field === 'episode', diag = tries + (episode ? 1 : 0);
    out.push({ m: 'POST', p: '/api/sync/diagnostics', code: 200, n: diag, at: e.at + 1000, ms: 22,
      req: { trigger: 'local_mutation', outcome: e.fail ? 'failed' : 'completed', device_id: 'pixel-8a', '…': '18 more fields' }, res: { status: 'ok' } });
    return out;
  }
  return [];
}
function eventsOf(e) {
  const T = s => sec2(e.at, s);
  if (e.k === 'traffic') return e.fail ? [[sec2(e.at + 14 * MIN, 11), 'warn', 'auth', 'Device session rejected', 'pixel-8a · session_expired'], [sec2(e.at + 14 * MIN, 11), 'info', 'sync', 'Reconcile refused with 401'], [sec2(e.at + 17 * MIN, 40), 'info', 'auth', 'Device signed in again', 'pixel-8a']]
    : [[T(0), 'info', 'sync', `${+e.s.match(/^(\d+)/)[1]} reconciles folded into this hour`]];
  if (e.k === 'change') return e.fail ? [[T(2), 'warn', 'sync', 'Phone change rejected', `${errOf(e).code} · ${errOf(e).msg}`], [T(2), 'info', 'sync', 'Phone will retry with backoff']] : [[T(1), 'info', 'sync', 'Phone change saved', `${e.a} · ${e.s}`]];
  if (e.k === 'edit') return [[T(0), 'info', 'editor', 'Anime updated', `${e.a} · ${e.s}`]];
  if (e.k === 'task') return [[sec2(e.at - 2 * MIN, 0), 'info', 'tasks', `${e.a} started`], [T(0), 'info', 'tasks', `${e.a} finished`, e.s]];
  if (e.et) return [[T(0), e.lvl, e.dom, e.a, e.et]];
  if (e.a === 'Bridge started') return [[T(0), 'info', 'app', 'Bridge started'], [T(3), 'info', 'sync', 'Listening for the phone']];
  if (e.a === 'Bridge stopped') return [[T(0), 'info', 'app', 'Bridge stopped', 'Window closed']];
  if (e.k === 'life') return FE_ERRS.map(x => [`${x.t}:${pad(x.ss)}`, 'error', 'frontend', `frontend ${x.kind}: ${x.msg}`, `route ${x.route} · ${x.source}`]);
  const hostFailed = /retr|failed/.test(e.s);
  return [[sec2(e.at - 7 * MIN, 2), 'info', 'download', 'Run started'],
    ...(hostFailed ? [[sec2(e.at - 6 * MIN, 30), 'warn', 'download', 'Host failed, trying the next one', 'link expired']] : []),
    [T(5), 'info', 'download', 'Run finished']];
}
function dataOf(e) {
  if (e.k === 'change') { const x = CHANGE_X[`${e.a}|${e.t}`] || {}, f = (x.field || 'Episode').toLowerCase();
    return [['Before', { anime: e.a, [f]: x.from ?? '0', version: 41 }], ['After', e.fail ? null : { anime: e.a, [f]: x.to ?? '1', version: 42 }]]; }
  if (e.k === 'traffic') return [['Hourly total', { hour: e.t, route: '/api/sync/reconcile', count: +e.s.match(/^(\d+)/)[1], failed: e.fail ? 1 : 0, max_duration_ms: e.slow ? 3400 : 412 }]];
  if (e.k === 'edit') { const [f, from, to] = EDIT_X[e.s] || ['field', '', e.s], key = f.toLowerCase().replace(/ /g, '_');
    return [['Before', { anime: e.a, [key]: from }], ['After', { anime: e.a, [key]: to, source: 'editor' }]]; }
  if (e.k === 'task') return [['Run', { kind: e.a === 'Schedule' ? 'schedule' : 'season_check', started_at: iso(e.at - 2 * MIN), finished_at: iso(e.at), result: e.s }]];
  if (e.et) return [['Event', { event_type: e.et, domain: e.dom, level: e.lvl, message: e.a, at: iso(e.at), metadata: e.meta }]];
  if (e.a.startsWith('Bridge st')) return [['Event', { event: e.a === 'Bridge started' ? 'started' : 'stopped', at: iso(e.at) }]];
  if (e.k === 'life') return [['Error', { source: 'window', occurrences: 5, first_at: iso(e.at - 21 * MIN), last_at: iso(e.at), route: FE_ERRS[0].route, message: FE_MSG }]];
  return [['Run', { kind: 'download', started_at: iso(e.at - 7 * MIN), finished_at: iso(e.at), steps: 5, outcome: 'completed' }]];
}
function techView(e) {
  const reqs = requestsOf(e), tabs = [reqs && ['requests', 'Requests'], ['events', 'Events'], ['data', 'Data']].filter(Boolean);
  if (!tabs.some(t => t[0] === techTab)) techTab = tabs[0][0];
  let html = gapsOf(e) + `<div class="ax-seg" role="tablist" id="dwTabs">${tabs.map(([v, l]) => `<button role="tab" data-tab="${v}" aria-pressed="${techTab === v}" aria-selected="${techTab === v}">${l}</button>`).join('')}</div>`;
  if (techTab === 'requests') {
    if (!reqs.length) return html + `<div class="ax-tech-empty">${svg('clock')}<b>Full requests are kept for 2 hours</b><span>This hour went fine, so only its totals are left. Failed requests are kept longer.</span></div>`;
    const r = reqs[Math.min(techReq, reqs.length - 1)], bad = r.code >= 400;
    if (reqs.length > 1) html += `<div class="ax-reqs" role="listbox" aria-label="Requests">${reqs.map((q, i) => `<button class="ax-req" role="option" data-req="${i}" aria-selected="${q === r}">
      <span class="p ax-mono"><span>${q.m}</span>${q.p}</span><span class="st">${q.notApplied ? '<span class="ax-code-chip bad">not applied</span>' : ''}<span class="ax-code-chip ${q.code >= 400 ? 'bad' : ''}">${q.code}</span></span><span class="ax-count">×${q.n}</span><span class="t">${hm(q.at)}</span></button>`).join('')}</div>`;
    const hdrs = o => `<dl class="ax-hdrs ax-mono">${Object.entries(o).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
    html += `<section class="ax-rq-panel" aria-label="Selected request"><div class="ax-rq-sum"><b class="ax-mono">${r.m} ${r.p}</b><span>${r.ms} ms</span>${r.n > 1 ? `<span>latest of ${r.n} · ${hm(r.at)}</span>` : ''}${reqs.length === 1 && r.notApplied ? '<span class="ax-code-chip bad">not applied</span>' : ''}</div>
      <div class="ax-rq"><div><h4>Request</h4>${hdrs({ ...PHONE_HDRS, 'X-Client-Request-Id': `c-${(r.at / 1000).toString(36)}` })}<pre class="ax-code ax-mono">${json(r.req)}</pre></div>
      <div><h4>Response <span class="ax-code-chip ${bad ? 'bad' : ''}">${r.code}</span>${r.trunc ? '<span class="ax-trunc" data-tip="Bodies are stored up to 64 KB">Cut at 64 KB</span>' : ''}</h4>
      ${hdrs({ 'Content-Type': 'application/json', 'Content-Length': r.trunc ? '186 204' : String(JSON.stringify(r.res).length), 'X-Request-Id': `r-${(r.at / 7).toString(36).slice(0, 8)}` })}<pre class="ax-code ax-mono">${json(r.res)}</pre></div></div></section>`;
    return html;
  }
  if (techTab === 'events') return html + `<ul class="ax-evs">${eventsOf(e).map(([t, lvl, dom, msg, sub]) =>
    `<li><span class="t ax-mono">${t}</span><span class="ax-lvl ${lvl}">${lvl}</span><span>${msg} <span class="m" style="color:var(--muted)">· ${dom}</span>${sub ? `<small class="ax-mono">${esc(sub)}</small>` : ''}</span></li>`).join('')}</ul>`;
  if (e.k === 'life' && !e.a.startsWith('Bridge st')) {
    const x = FE_ERRS[Math.min(techReq, FE_ERRS.length - 1)];
    return html + `<div class="ax-seg" role="group" aria-label="Occurrence">${FE_ERRS.map((y, i) => `<button data-req="${i}" aria-pressed="${y === x}">${y.t}</button>`).join('')}</div>`
      + sec('', facts([['Kind', x.kind], ['Page', `${x.page} <span class="ax-mono" style="color:var(--muted)">${x.route}</span>`], ['Source', `<span class="ax-mono" style="font-size:12px">${x.source}</span>`], ['At', `${x.t}:${pad(x.ss)}`]]))
      + sec('Message', `<pre class="ax-code ax-mono" style="white-space:pre-wrap">${esc(x.msg)}</pre>`)
      + `<section class="ax-sec"><h3 style="display:flex;gap:8px;align-items:center">Stack trace${x.cut ? '<span class="ax-trunc" data-tip="Stacks are stored up to 8 KB">Cut at 8 KB</span>' : ''}</h3><pre class="ax-code ax-mono">${esc(x.stack)}</pre></section>`;
  }
  return html + dataOf(e).map(([title, o]) => sec(title, o ? `<pre class="ax-code ax-mono">${json(o)}</pre>` : '<p class="ax-note">Nothing was saved, so there is no after.</p>')).join('');
}

const dw = document.getElementById('dw');
let tech = false, techTab = 'requests', techReq = 0;
function openDetail(id) {
  if (id !== openId) techReq = 0;
  const e = E[id]; openId = id;
  const icCls = e.fail ? 'ax-ic fail' : e.slow ? 'ax-ic slow' : 'ax-ic';
  dw.innerHTML = `<header class="ax-dw-head">
      <span class="${icCls}" data-tip="${ORIGIN[e.o]}" aria-label="${ORIGIN[e.o]}">${svg(e.o === 'phone' ? 'phone' : 'bridge')}</span>
      <div><h2 class="ax-dw-title" id="dwTitle">${e.a}</h2>${e.s ? `<p class="ax-dw-sub ${e.fail ? 'bad' : ''}">${e.s}</p>` : ''}<p class="ax-dw-meta">${full(e.at)}</p></div>
      <div class="ax-dw-acts">${tech ? `<button class="ax-ib sm" id="dwTech" data-tip="Back to summary" aria-label="Back to summary">${svg('back')}</button>`
        : `<button class="ax-ib sm" id="dwTech" data-tip="Technical details" aria-label="Technical details">${svg('code')}</button>`}
        <button class="ax-ib sm" data-copy="1" data-tip="Copy for AI" aria-label="Copy for AI">${svg('copy')}</button>
        <button class="ax-ib sm" id="dwX" data-tip="Close" aria-label="Close">${svg('close')}</button></div></header>
    <div class="ax-dw-body">${tech ? techView(e) : viewOf(e)(e)}</div>
    <p class="ax-dw-keys"><kbd>↑</kbd><kbd>↓</kbd> previous or next event</p>`;
  dw.classList.add('open');
  dw.classList.toggle('wide', tech);
  document.querySelectorAll('#feed .ax-row').forEach(r => r.classList.toggle('sel', +r.dataset.id === id));
  document.querySelector(`#feed .ax-row[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest' });
}
function closeDetail() {
  if (openId === null) return;
  const r = document.querySelector(`#feed .ax-row[data-id="${openId}"]`);
  openId = null; tech = false; dw.classList.remove('open', 'wide');
  document.querySelectorAll('#feed .ax-row.sel').forEach(x => x.classList.remove('sel'));
  r?.focus({ preventScroll: true });
}
document.getElementById('feed').addEventListener('click', ev => {
  if (ev.target.closest('[data-copy]')) { ev.stopPropagation(); toast('Copied for AI'); return; }
  const r = ev.target.closest('.ax-row.open'); if (r) openDetail(+r.dataset.id);
});
document.getElementById('feed').addEventListener('keydown', ev => {
  const r = ev.target.closest('.ax-row.open'); if (r && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openDetail(+r.dataset.id); }
});
dw.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]'), req = ev.target.closest('[data-req]');
  if (ev.target.closest('#dwX')) closeDetail();
  else if (ev.target.closest('#dwTech')) { tech = !tech; openDetail(openId); }
  else if (tab) { techTab = tab.dataset.tab; openDetail(openId); }
  else if (req) { techReq = +req.dataset.req; openDetail(openId); }
  else if (ev.target.closest('[data-copy]')) toast(tech ? 'Copied requests, events and data for AI' : 'Copied for AI');
});
// the feed stays usable behind the drawer: another row switches the detail, anywhere else closes it
document.addEventListener('pointerdown', ev => { if (openId !== null && !ev.target.closest('#dw, #feed .ax-row.open')) closeDetail(); });
document.addEventListener('keydown', ev => {
  if (openId === null) return;
  if (ev.key === 'Escape' && !st.failOpen) closeDetail();
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  const rows = [...document.querySelectorAll('#feed .ax-row.open')], i = rows.findIndex(r => +r.dataset.id === openId);
  const next = rows[i + (ev.key === 'ArrowDown' ? 1 : -1)];
  if (next) { ev.preventDefault(); openDetail(+next.dataset.id); }
});
document.getElementById('pin').addEventListener('click', () => toast('Moment pinned'));
render();
</script>
</body>
