openapi: 3.1.0
info:
  title: Autoreas Bridge API
  version: 1.1.0
  description: |
    REST API exposed by the Autoreas Bridge desktop application on 0.0.0.0:9876.
    Used by mobile clients to pair, bootstrap local SQLite state, fetch incremental
    bridge changelogs, patch anime state, inspect bridge status, and receive real-time events.

    2026-07-19 — SDD-52 API consumer impact: vocabulary-only bridge refactor.
    No HTTP path, REST field, WebSocket message field, or payload shape changed.
    ADR-007 legacy payload names such as `nrocapvisto` and `totalcap` remain byte-identical.

    2026-07-21 — SDD-55 API consumer impact: additive English wire field rename for
    PATCH /api/animes/{id}. Bridge accepted (and documented) `status`, `episodesWatched`,
    and `days` as English equivalents of the Legacy-Spanish `estado`, `nrocapvisto`, and
    `dias` fields, with identical validation ranges and semantics.

    2026-07-22 — SDD-56 BREAKING CHANGE, supersedes SDD-55's additive alias notice above:
    hard English-only cutover across every response DTO (GET /api/animes, GET
    /api/animes/{id}, GET /api/animes/changes, WebSocket payloads) and the PATCH
    /api/animes/{id} request body. All Legacy-Spanish field names (`estado`, `nrocapvisto`,
    `dias`, `nombre`, `activo`, `primeravez`, `fechaUltCapVisto`, `fechaEstreno`,
    `fechaCreacion`, `fechaEliminacion`, `portada`, `pagina`, `carpeta`, `estudios`,
    `origen`, `duracion`, `tipo`, `dia`, `orden`, `numrepeticion`, `repetir`) are GONE from
    every response and are REJECTED on PATCH: a PATCH body carrying a deprecated Spanish
    key without its English replacement now fails with `400 Bad Request` instead of being
    silently accepted (see the PATCH operation below for the exact behavior). The
    `$$date` extended-JSON date wrapper is gone everywhere; every date field is now a
    plain epoch-milliseconds integer or `null`. See `docs/sdd-55-mobile-impact.md` for the
    full breaking-change migration notice and name map; deploy is lockstep-gated on the
    `autoreas-mobile` English client shipping first.

    2026-07-22 — SDD-57 API consumer impact: NO WIRE CHANGE. Added a batch
    "Create anime" capability (Editor-only, Legacy "Agregar" replacement) as a
    new Wails desktop binding `App.CreateAnime`, not an HTTP/WebSocket surface.
    `POST /api/animes` remains excluded and still returns 405 — mobile clients
    are unaffected and require no update.

    2026-07-24 — capture-middleware-realtime API consumer impact: NO REST/WS
    wire change (no HTTP path, request/response field, or WebSocket message
    shape changed). This is a bridge-internal observability rework, announced
    here per project convention since it touches the request/WS-adjacent
    surface:
      - The `http.request` structured log line (emitted per HTTP request by
        the former `RequestLoggingMiddleware`) is REMOVED. Request/response
        telemetry now lives exclusively in the `request_captures` SQLite
        table (renamed from `mobile_request_captures` by
        capture-nomenclature-rename below) via a transport-level capture
        middleware, not in logs.
      - Every `/api/*` request and every inbound WebSocket `reconcile`
        message now writes a "pending" arrival row the moment it is received,
        which is later upserted (same `request_id`, never duplicated) to a
        terminal row once the request/message finishes. Hub connection
        lifecycle (`ws_connect`/`ws_disconnect`) and outbound broadcasts
        (`ws_broadcast`) are captured the same way, one-way (no HTTP
        status/duration).
      - The bridge desktop app now emits a new Wails runtime event,
        `capture.transaction`, once per persisted capture row (arrival or
        terminal), carrying the same English camelCase `CaptureRow` shape
        already used by `ListCaptureTransactions`/`GetCaptureTransaction`
        (`requestId`, `capturedAtMs`, `kind`, `route`, `transport`,
        `outcome`, `errorCode`, `httpStatus`, `durationMs`, `animeId`). This
        is a desktop-app-internal (Wails) event, not an HTTP/WS wire
        surface — mobile clients over `/api`/`/ws` are unaffected and
        require no update.

    2026-07-25 — capture-nomenclature-rename API consumer impact: NO REST/WS
    wire change (no HTTP path, request/response field, or WebSocket message
    shape changed). This renames the capture/MCP surface to match what it
    actually captures (all `/api/*` traffic and hub/WS events, not only
    mobile traffic), plus one on-disk table rename:
      - BREAKING for MCP clients only: the read-only `autoreas-request-mcp`
        sidecar (renamed from `autoreas-mobile-request-mcp`) now registers
        exactly `search_requests`, `get_request_context`,
        `resolve_request_context`, `summary_requests` — the previous names
        `search_mobile_requests`, `get_mobile_request_context`,
        `resolve_mobile_request_context`, `summary_mobile_requests` are
        REMOVED with NO ALIASES and are rejected as unsupported. Any local
        MCP client registration must point at the rebuilt
        `autoreas-request-mcp` binary (`.mcp.json` updated in this change).
      - The capture tables are renamed in place (existing rows preserved):
        `mobile_request_captures` → `request_captures`,
        `mobile_request_capture_metadata` → `request_capture_metadata`.
        The stored capture schema version is bumped `2` → `3`. The read path
        (in-process and the MCP sidecar) tolerates both table generations
        and schema versions `{1,2,3}`, so an un-migrated database still
        opens and serves.
      - `POST /api/*`, `GET /api/*`, and `/ws` are entirely unaffected —
        mobile clients require no update.

    2026-07-29 — mcp-runtime-events-read API consumer impact: NO REST/WS wire
    change (no HTTP path, request/response field, or WebSocket message shape
    changed). The sidecar's MCP tool schema is a separate, non-HTTP contract;
    this note documents it here per project convention only.
      - Adds a persisted runtime-event log (`runtime_events` SQLite table,
        additive, distinct from `activity_log` and `request_captures`) fed
        non-blockingly from the shared logger, with a bounded row cap and a
        write-count-cadence prune. `debug`-level entries are dropped by
        default; configurable via the `app_settings` key
        `observability.events.persist_debug` (`"true"`/`"false"`, default
        OFF/unset).
      - The read-only `autoreas-request-mcp` sidecar's bounded tool surface
        grows from four to exactly seven tools: the four existing
        `resolve_request_context`, `search_requests`, `get_request_context`,
        `summary_requests` are unchanged, plus three new read-only tools —
        `search_events`, `summary_events`, `get_correlation_timeline` — over
        the new runtime-event log. No alias name is introduced for any tool.
      - `search_events` accepts an `EventFilters` shape distinct from the
        capture `SearchFilters`: `domain`, `level`, `event_type`,
        `correlation_id`, `entity_id`, free `text` (matches message/domain/
        event_type only, never `metadata_json`), `start_ms`/`end_ms`. Returns
        the same `applied_limit`/`next_cursor`/`malformed_rows_skipped`/
        `warning_count` newest-first page contract as `search_requests`.
      - `get_correlation_timeline` resolves one `correlation_id` into the
        matching captured request(s) plus matching persisted events in one
        call; a sidecar pointed at a bridge database that predates this
        change degrades to `events_available: false` with capture-side
        matches still returned, rather than failing.
      - `POST /api/*`, `GET /api/*`, and `/ws` are entirely unaffected —
        mobile clients require no update.

    2026-08-30 — SDD-64 API consumer impact: NO wire SHAPE change, but a
    previously-always-empty field starts carrying values. `AnimeChange.changed_fields`
    (GET /api/animes/changes) and the `changedFields` member of the `anime_changed`
    WebSocket notice have shipped as an empty array for every change since they
    were introduced, because none of the six bridge producers of the internal
    `anime.changed` event ever populated them. The bridge now DERIVES that list
    inside the transaction that commits a write, by comparing the write's base
    and desired snapshots, so it names the top-level snapshot fields that
    actually differ.
      - Field name, type, and required-ness are unchanged: still a required
        array of strings, still sorted for stability, still `[]` when a write
        changed nothing.
      - A client that ignored the field keeps working unchanged. A client that
        treated "empty array" as "no information available" and refetched the
        whole snapshot will now receive a usable list and can narrow its work.
      - Rows written before this change carry no derived list and continue to
        read as `[]`; no backfill is performed.

    2026-08-01 — orphaned-capture-sweep API consumer impact: NO REST/WS wire
    change (no HTTP path, request/response field, or WebSocket message shape
    changed). Bridge-internal observability fix, announced here per project
    convention because it widens the capture outcome vocabulary the MCP
    sidecar exposes.
      - New terminal capture outcome: `abandoned`. A capture row is written
        twice under one `request_id` — a `pending` arrival before the handler
        runs, then a terminal row. A process that dies between the two (force
        close, crash, or a shutdown that tore down the capture queue and its
        SQLite fallback first) previously left the arrival stranded as
        `pending` forever, and the desktop Activity view rendered it as an
        in-flight request whose elapsed clock grew without bound.
      - The bridge now sweeps those rows once at startup, before the HTTP
        server accepts connections — a window in which no request can
        legitimately be in flight, so every `pending` row present is provably
        an orphan. Swept rows keep a NULL `http_status` and NULL
        `duration_ms`: the bridge never observed a response or a completion,
        and inventing either would make the row claim a wire fact that never
        happened.
      - MCP clients filtering or grouping `outcome` (`search_requests`,
        `summary_requests`) must treat `abandoned` as a terminal value
        alongside `accepted`/`rejected`/`malformed`/`completed`. Historical
        rows already stranded in `pending` are rewritten in place on the next
        launch; the sweep is idempotent across restarts.
      - `POST /api/*`, `GET /api/*`, and `/ws` are entirely unaffected —
        mobile clients require no update.

    2026-09-03 — bridge-sync-contract-fixes API consumer impact: ONE BEHAVIOR
    change to an existing response field, no shape change (no HTTP path, no
    added or removed field, no WebSocket message shape changed).
      - `POST /api/sync/reconcile` → `last_changelog_id` is now clamped so it
        is never lower than the `last_changelog_id` the client sent. The value
        is derived from the newest changelog row still stored, and the bridge
        prunes rows once every paired device has acknowledged them — so a fully
        acknowledged changelog is an empty one and the raw derivation yielded
        `0`. A client that persisted that `0` unconditionally would rewind to
        the start of history and re-download every change. Measured against
        four real paired devices over the retained capture window, no client
        ever actually rewound, so no shipped consumer is known to be affected;
        this closes the trap for future clients that lack the guard. Clients
        should still refuse any non-advancing cursor.
      - `applied_operations` is always present (`[]` and never `null`), one
        entry per pending operation sent and in the same order, and
        `applied: false` for an unsupported operation type or a conflict.
        This part was already true and is now simply documented. The
        conflict half was NOT already true, and this note previously
        claimed otherwise: before SDD-66, a conflict never reached the
        `applied_operations` append at all — `applyPendingOperations`
        aborted the batch mid-loop and the request failed with an
        unreachable HTTP 500, discarding `applied_operations`,
        `bridge_changes`, and `last_changelog_id` for the entire request.
        SDD-66 (2026-09-04) is what makes conflict-as-a-per-operation-outcome
        real and reachable for the first time, alongside the new
        `modified_at` and `reason` fields on `AppliedOperation` — see that
        schema and the `applied_operations` property description below.
      - Bridge-internal, announced per project convention: credential header
        VALUES (`Authorization`, `Proxy-Authorization`, `Cookie`,
        `Set-Cookie`) are replaced with `[redacted]` before a capture row is
        persisted to `request_captures`. The header KEY is kept, so Activity
        still reports that a request was authenticated. Every other header,
        including ones no one enumerated in advance, is still stored verbatim
        — the redaction is value-scoped precisely so a future correlation
        header cannot be dropped silently. No wire surface changed: mobile
        clients still send `Authorization` exactly as before.

    Excluded endpoints (always return 405 - intentionally undocumented):
      POST   /api/animes
      DELETE /api/animes/{id}

x-websocket:
  path: /ws
  description: |
    WebSocket endpoint for real-time anime change events.
    Authentication: Bearer token via Authorization header OR ?token= query param.
    On connect, server sends: {"type":"sync_required","reason":"connection_gap_assumed"}
    Compatibility inbound message:
      - {"type":"reconcile","device_id":"<id>","last_changelog_id":0,"pending_operations":[...]}
        Update-compatible pending operations are applied through the same validation and durable write path used by PATCH /api/animes/{id}.
    Broadcasts:
      - {"type":"anime_changed","anime_id":"<id>","payload":<object>}
      - {"type":"anime_created","anime_id":"<id>"}
      - {"type":"anime_deleted","anime_id":"<id>"}
  responses:
    101: Upgrade success
    401: Authentication failure
    503: Hub unavailable
  observability: |
    2026-07-24 — capture-middleware-realtime: connection lifecycle
    (register/unregister) and every outbound broadcast are now captured at
    the realtime hub seam (`ws_connect`/`ws_disconnect`/`ws_broadcast`
    kinds, outcome `opened`/`closed`/`pushed`) into `request_captures`
    (renamed from `mobile_request_captures` by capture-nomenclature-rename)
    and surfaced live to the bridge desktop app via the `capture.transaction`
    Wails runtime event. No wire-message shape changed.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid request body

    StatusOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    StatusAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: accepted

    AnimeDay:
      type: object
      required: [day, order]
      properties:
        day:
          type: string
          example: Monday
        order:
          type: integer

    Anime:
      type: object
      required: [id, name, status, episodesWatched, active, firstCycle, days, genres]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: integer
          minimum: 0
          maximum: 3
        episodesWatched:
          type: number
          minimum: 0
        totalEpisodes:
          type: integer
          nullable: true
        active:
          type: integer
          minimum: 0
          maximum: 1
        firstCycle:
          type: integer
          minimum: 0
          maximum: 1
        days:
          type: array
          items:
            $ref: '#/components/schemas/AnimeDay'
        genres:
          type: array
          items:
            type: string
        kind:
          type: integer
          nullable: true
        lastWatchedAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        premieredAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        createdAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        deletedAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        cover:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        folder:
          type: string
          nullable: true
        studios:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        modified_at:
          type: integer
          description: |
            Bridge-private, strictly-monotonic optimistic-concurrency version
            token (SDD-30). Echo this value back as `base` on the next patch
            for this anime so the bridge can fast-forward instead of treating
            the write as a divergent conflict.

    AnimeChange:
      type: object
      required: [record_id, change_type, changed_fields, timestamp]
      properties:
        record_id:
          type: string
        change_type:
          type: string
          enum: [create, update, delete]
        changed_fields:
          type: array
          items:
            type: string
        snapshot:
          $ref: '#/components/schemas/Anime'
        timestamp:
          type: integer

    AppliedOperation:
      type: object
      required: [anime_id, operation, applied]
      description: |
        The bridge's acknowledgement of exactly one `pending_operations` entry the
        client sent. It is an acknowledgement, not an error channel: a rejected
        operation is reported here, it is not omitted.
      properties:
        anime_id:
          type: string
          description: Echoes the `anime_id` of the pending operation being acknowledged.
        operation:
          type: string
          description: Echoes the `operation` of the pending operation being acknowledged.
        applied:
          type: boolean
          description: |
            `true` when the bridge durably applied the operation. `false` has exactly
            two causes, now distinguished by `reason`: the operation type is not
            supported (anything other than an update-compatible patch), or the write
            lost an optimistic-concurrency check and resolved as a conflict.
        modified_at:
          type: integer
          description: |
            The bridge's current OCC token for this anime, present whenever a write
            outcome was computed for this operation -- applied, no-op, or conflict --
            including when the value is `0`, which is a legitimate live token in this
            codebase, never a sentinel for "no token". Absent entirely for a skipped
            operation (`reason: unsupported_operation`), since no write outcome exists
            to report. Source per outcome: an applied write returns the new
            strictly-increasing token; a no-op returns the anime's unchanged token
            verbatim; a conflict returns the anime's current winning token, so the
            client can re-base its next `base` on it. A client arms optimistic
            concurrency by echoing this value back as `base` on its next write for the
            same `anime_id`.
        reason:
          type: string
          enum: [unsupported_operation, conflict]
          description: |
            Present only when `applied` is `false`; absent whenever `applied` is
            `true`. `unsupported_operation` is permanent -- the operation type is not
            an update-compatible patch, and the client should discard it, never retry.
            `conflict` is recoverable -- the write lost an optimistic-concurrency
            check; the client should re-base on the accompanying `modified_at` and
            retry. A client receiving a `reason` value outside this enum MUST surface
            it rather than silently discarding the operation: guessing "permanent" on
            an unrecognised, potentially recoverable cause would silently drop a
            user's edit. A future third cause is always a new named value, never
            folded into one of these two.

    DeviceInfo:
      type: object
      required: [device_id, device_name, paired_at_ms]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        paired_at_ms:
          type: integer

    ConflictInfo:
      type: object
      required: [conflict_id, anime_id, detected_at_ms, status]
      properties:
        conflict_id:
          type: string
        anime_id:
          type: string
        detected_at_ms:
          type: integer
        status:
          type: string
        local_snapshot_json:
          type: string
          format: byte
          nullable: true
          description: |
            Base64-encoded canonical anime JSON as it stood on the bridge
            when the conflict was detected (SDD-30 ADR-30-4).
        remote_snapshot_json:
          type: string
          format: byte
          nullable: true
          description: |
            Base64-encoded canonical anime JSON the mobile client attempted
            to write, which diverged from local_snapshot_json (SDD-30 ADR-30-4).

    ActiveSeasonCandidate:
      type: object
      required: [anime_id]
      properties:
        anime_id:
          type: string
        grade:
          type: integer
          nullable: true
        grade_source:
          type: string

    ActiveSeasonSnapshot:
      type: object
      required: [season_id, candidates]
      properties:
        season_id:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ActiveSeasonCandidate'

    BridgeStatus:
      type: object
      required: [status, last_changelog_id]
      properties:
        status:
          type: string
        last_changelog_id:
          type: integer
        last_changed_at_ms:
          type: integer
          nullable: true
        server_address:
          type: string

    ReconcileRequest:
      type: object
      properties:
        device_id:
          type: string
        last_changelog_id:
          type: integer
        pending_operations:
          type: array
          items:
            type: object
            properties:
              anime_id:
                type: string
              operation:
                type: string
              payload:
                type: object
              created_at:
                type: integer

    ReconcileResponse:
      type: object
      required: [status, last_changelog_id, applied_operations, bridge_changes, conflicts]
      properties:
        status:
          type: string
        last_changelog_id:
          type: integer
          description: |
            The cursor the client should now hold. Always greater than or equal to the
            `last_changelog_id` the client sent: it never rewinds a caller.

            This guarantee is newer than the field. The bridge derives the value from
            the newest changelog row it still stores, and it prunes rows once every
            paired device has acknowledged them — so a fully acknowledged changelog is
            an empty one, and the raw derivation yields `0`. Until 2026-09-03 that `0`
            was returned verbatim, and a client that persisted it unconditionally would
            rewind to the start of history and re-download every change. Clients should
            still refuse any non-advancing cursor; the bridge no longer emits one.
        applied_operations:
          type: array
          description: |
            One entry per `pending_operations` entry sent, in the same order. Always
            present: it serializes as `[]` when the request carried no pending
            operations, never as `null`. An operation the bridge refused is present
            with `applied: false` rather than absent, so a client can confirm every
            operation it sent was seen — including the ones that did not land. A
            conflict never aborts the batch: the HTTP status, `last_changelog_id`,
            and `bridge_changes` are unaffected, and every later operation in the
            batch is still processed.

            Intra-batch conflict guard: once an operation for a given `anime_id` has
            conflicted within this batch, a later operation for that same `anime_id`
            in the same batch that omits `base` is NOT applied -- it is reported
            `applied: false, reason: conflict` with the same winning `modified_at` as
            the operation that conflicted, and the write is never attempted. This
            prevents the deliberate no-`base` OCC bypass from silently overwriting the
            value the earlier conflict just protected. A later operation for that same
            `anime_id` that DOES carry its own `base` is still evaluated normally and
            can succeed. Retry-accounting caveat: a blocked operation did not fail on
            its own merits -- it was blocked by an earlier one in the same batch -- so
            a client with a bounded per-operation retry counter must not charge it as
            its own failed attempt.
          items:
            $ref: '#/components/schemas/AppliedOperation'
        bridge_changes:
          type: array
          items:
            $ref: '#/components/schemas/AnimeChange'
        conflicts:
          type: array
          deprecated: true
          description: |
            Always `[]`. Superseded by the per-operation `reason: conflict` +
            `modified_at` on `AppliedOperation`, which carries the same fact at the
            granularity a client can act on. Kept emitting `[]` for backward
            compatibility with a consumer checking `response.conflicts.length`;
            removal is a separate announced change, since `conflicts` is a required
            field today.
          items:
            type: object

paths:
  /api/devices/pair:
    post:
      summary: Pair a mobile device
      description: |
        Validates the pairing token displayed in the Bridge UI and registers the device.
        Returns a persistent auth_token for subsequent authenticated requests.
        No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_token, device_name]
              additionalProperties: false
              properties:
                pairing_token:
                  type: string
                device_name:
                  type: string
      responses:
        '201':
          description: Device paired successfully
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_name, auth_token]
                properties:
                  device_id:
                    type: string
                  device_name:
                    type: string
                  auth_token:
                    type: string
        '400':
          description: Invalid request body or pairing request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid pairing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices:
    get:
      summary: List paired devices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paired devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfo'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/{id}:
    delete:
      summary: Revoke a paired device
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/seasons/active:
    get:
      summary: Fetch the active season snapshot
      description: |
