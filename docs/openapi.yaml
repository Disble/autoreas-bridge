        '200':
          description: Active season snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSeasonSnapshot'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active season
          content:
            application/json:
              schema:
