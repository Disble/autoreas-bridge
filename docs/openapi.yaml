openapi: 3.1.0
info:
  title: Autoreas Bridge API
  version: 1.1.0
  description: |
    REST API exposed by the Autoreas Bridge desktop application on 0.0.0.0:8080.
    Used by mobile clients to pair, bootstrap local SQLite state, fetch incremental
    bridge changelogs, patch anime state, inspect bridge status, and receive real-time events.

    2026-07-19 — SDD-52 API consumer impact: vocabulary-only bridge refactor.
    No HTTP path, REST field, WebSocket message field, or payload shape changed.
    ADR-007 legacy payload names such as `nrocapvisto` and `totalcap` remain byte-identical.

    2026-07-21 — SDD-55 API consumer impact: additive English wire field rename for
    PATCH /api/animes/{id}. Bridge accepted (and documented) `status`, `episodesWatched`,
    and `days` as English equivalents of the Legacy-Spanish `estado`, `nrocapvisto`, and
    `dias` fields, with identical validation ranges and semantics.

    2026-07-22 — SDD-56 BREAKING CHANGE, supersedes SDD-55's additive alias notice above:
    hard English-only cutover across every response DTO (GET /api/animes, GET
    /api/animes/{id}, GET /api/animes/changes, WebSocket payloads) and the PATCH
    /api/animes/{id} request body. All Legacy-Spanish field names (`estado`, `nrocapvisto`,
    `dias`, `nombre`, `activo`, `primeravez`, `fechaUltCapVisto`, `fechaEstreno`,
    `fechaCreacion`, `fechaEliminacion`, `portada`, `pagina`, `carpeta`, `estudios`,
    `origen`, `duracion`, `tipo`, `dia`, `orden`, `numrepeticion`, `repetir`) are GONE from
    every response and are REJECTED on PATCH: a PATCH body carrying a deprecated Spanish
    key without its English replacement now fails with `400 Bad Request` instead of being
    silently accepted (see the PATCH operation below for the exact behavior). The
    `$$date` extended-JSON date wrapper is gone everywhere; every date field is now a
    plain epoch-milliseconds integer or `null`. See `docs/sdd-55-mobile-impact.md` for the
    full breaking-change migration notice and name map; deploy is lockstep-gated on the
    `autoreas-mobile` English client shipping first.

    2026-07-22 — SDD-57 API consumer impact: NO WIRE CHANGE. Added a batch
    "Create anime" capability (Editor-only, Legacy "Agregar" replacement) as a
    new Wails desktop binding `App.CreateAnime`, not an HTTP/WebSocket surface.
    `POST /api/animes` remains excluded and still returns 405 — mobile clients
    are unaffected and require no update.

    2026-07-24 — capture-middleware-realtime API consumer impact: NO REST/WS
    wire change (no HTTP path, request/response field, or WebSocket message
    shape changed). This is a bridge-internal observability rework, announced
    here per project convention since it touches the request/WS-adjacent
    surface:
      - The `http.request` structured log line (emitted per HTTP request by
        the former `RequestLoggingMiddleware`) is REMOVED. Request/response
        telemetry now lives exclusively in the `request_captures` SQLite
        table (renamed from `mobile_request_captures` by
        capture-nomenclature-rename below) via a transport-level capture
        middleware, not in logs.
      - Every `/api/*` request and every inbound WebSocket `reconcile`
        message now writes a "pending" arrival row the moment it is received,
        which is later upserted (same `request_id`, never duplicated) to a
        terminal row once the request/message finishes. Hub connection
        lifecycle (`ws_connect`/`ws_disconnect`) and outbound broadcasts
        (`ws_broadcast`) are captured the same way, one-way (no HTTP
        status/duration).
      - The bridge desktop app now emits a new Wails runtime event,
        `capture.transaction`, once per persisted capture row (arrival or
        terminal), carrying the same English camelCase `CaptureRow` shape
        already used by `ListCaptureTransactions`/`GetCaptureTransaction`
        (`requestId`, `capturedAtMs`, `kind`, `route`, `transport`,
        `outcome`, `errorCode`, `httpStatus`, `durationMs`, `animeId`). This
        is a desktop-app-internal (Wails) event, not an HTTP/WS wire
        surface — mobile clients over `/api`/`/ws` are unaffected and
        require no update.

    2026-07-25 — capture-nomenclature-rename API consumer impact: NO REST/WS
    wire change (no HTTP path, request/response field, or WebSocket message
    shape changed). This renames the capture/MCP surface to match what it
    actually captures (all `/api/*` traffic and hub/WS events, not only
    mobile traffic), plus one on-disk table rename:
      - BREAKING for MCP clients only: the read-only `autoreas-request-mcp`
        sidecar (renamed from `autoreas-mobile-request-mcp`) now registers
        exactly `search_requests`, `get_request_context`,
        `resolve_request_context`, `summary_requests` — the previous names
        `search_mobile_requests`, `get_mobile_request_context`,
        `resolve_mobile_request_context`, `summary_mobile_requests` are
        REMOVED with NO ALIASES and are rejected as unsupported. Any local
        MCP client registration must point at the rebuilt
        `autoreas-request-mcp` binary (`.mcp.json` updated in this change).
      - The capture tables are renamed in place (existing rows preserved):
        `mobile_request_captures` → `request_captures`,
        `mobile_request_capture_metadata` → `request_capture_metadata`.
        The stored capture schema version is bumped `2` → `3`. The read path
        (in-process and the MCP sidecar) tolerates both table generations
        and schema versions `{1,2,3}`, so an un-migrated database still
        opens and serves.
      - `POST /api/*`, `GET /api/*`, and `/ws` are entirely unaffected —
        mobile clients require no update.

    2026-07-29 — mcp-runtime-events-read API consumer impact: NO REST/WS wire
    change (no HTTP path, request/response field, or WebSocket message shape
    changed). The sidecar's MCP tool schema is a separate, non-HTTP contract;
    this note documents it here per project convention only.
      - Adds a persisted runtime-event log (`runtime_events` SQLite table,
        additive, distinct from `activity_log` and `request_captures`) fed
        non-blockingly from the shared logger, with a bounded row cap and a
        write-count-cadence prune. `debug`-level entries are dropped by
        default; configurable via the `app_settings` key
        `observability.events.persist_debug` (`"true"`/`"false"`, default
        OFF/unset).
      - The read-only `autoreas-request-mcp` sidecar's bounded tool surface
        grows from four to exactly seven tools: the four existing
        `resolve_request_context`, `search_requests`, `get_request_context`,
        `summary_requests` are unchanged, plus three new read-only tools —
        `search_events`, `summary_events`, `get_correlation_timeline` — over
        the new runtime-event log. No alias name is introduced for any tool.
      - `search_events` accepts an `EventFilters` shape distinct from the
        capture `SearchFilters`: `domain`, `level`, `event_type`,
        `correlation_id`, `entity_id`, free `text` (matches message/domain/
        event_type only, never `metadata_json`), `start_ms`/`end_ms`. Returns
        the same `applied_limit`/`next_cursor`/`malformed_rows_skipped`/
        `warning_count` newest-first page contract as `search_requests`.
      - `get_correlation_timeline` resolves one `correlation_id` into the
        matching captured request(s) plus matching persisted events in one
        call; a sidecar pointed at a bridge database that predates this
        change degrades to `events_available: false` with capture-side
        matches still returned, rather than failing.
      - `POST /api/*`, `GET /api/*`, and `/ws` are entirely unaffected —
        mobile clients require no update.

    Excluded endpoints (always return 405 - intentionally undocumented):
      POST   /api/animes
      DELETE /api/animes/{id}

x-websocket:
  path: /ws
  description: |
    WebSocket endpoint for real-time anime change events.
    Authentication: Bearer token via Authorization header OR ?token= query param.
    On connect, server sends: {"type":"sync_required","reason":"connection_gap_assumed"}
    Compatibility inbound message:
      - {"type":"reconcile","device_id":"<id>","last_changelog_id":0,"pending_operations":[...]}
        Update-compatible pending operations are applied through the same validation and durable write path used by PATCH /api/animes/{id}.
    Broadcasts:
      - {"type":"anime_changed","anime_id":"<id>","payload":<object>}
      - {"type":"anime_created","anime_id":"<id>"}
      - {"type":"anime_deleted","anime_id":"<id>"}
  responses:
    101: Upgrade success
    401: Authentication failure
    503: Hub unavailable
  observability: |
    2026-07-24 — capture-middleware-realtime: connection lifecycle
    (register/unregister) and every outbound broadcast are now captured at
    the realtime hub seam (`ws_connect`/`ws_disconnect`/`ws_broadcast`
    kinds, outcome `opened`/`closed`/`pushed`) into `request_captures`
    (renamed from `mobile_request_captures` by capture-nomenclature-rename)
    and surfaced live to the bridge desktop app via the `capture.transaction`
    Wails runtime event. No wire-message shape changed.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid request body

    StatusOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    StatusAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: accepted

    AnimeDay:
      type: object
      required: [day, order]
      properties:
        day:
          type: string
          example: Monday
        order:
          type: integer

    Anime:
      type: object
      required: [id, name, status, episodesWatched, active, firstCycle, days, genres]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: integer
          minimum: 0
          maximum: 3
        episodesWatched:
          type: number
          minimum: 0
        totalEpisodes:
          type: integer
          nullable: true
        active:
          type: integer
          minimum: 0
          maximum: 1
        firstCycle:
          type: integer
          minimum: 0
          maximum: 1
        days:
          type: array
          items:
            $ref: '#/components/schemas/AnimeDay'
        genres:
          type: array
          items:
            type: string
        kind:
          type: integer
          nullable: true
        lastWatchedAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        premieredAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        createdAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        deletedAt:
          type: integer
          nullable: true
          description: Epoch milliseconds, or null (SDD-56 flattened the `$$date` wrapper).
        cover:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        folder:
          type: string
          nullable: true
        studios:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        modified_at:
          type: integer
          description: |
            Bridge-private, strictly-monotonic optimistic-concurrency version
            token (SDD-30). Echo this value back as `base` on the next patch
            for this anime so the bridge can fast-forward instead of treating
            the write as a divergent conflict.

    AnimeChange:
      type: object
      required: [record_id, change_type, changed_fields, timestamp]
      properties:
        record_id:
          type: string
        change_type:
          type: string
          enum: [create, update, delete]
        changed_fields:
          type: array
          items:
            type: string
        snapshot:
          $ref: '#/components/schemas/Anime'
        timestamp:
          type: integer

    AppliedOperation:
      type: object
      required: [anime_id, operation, applied]
      properties:
        anime_id:
          type: string
        operation:
          type: string
        applied:
          type: boolean

    DeviceInfo:
      type: object
      required: [device_id, device_name, paired_at_ms]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        paired_at_ms:
          type: integer

    ConflictInfo:
      type: object
      required: [conflict_id, anime_id, detected_at_ms, status]
      properties:
        conflict_id:
          type: string
        anime_id:
          type: string
        detected_at_ms:
          type: integer
        status:
          type: string
        local_snapshot_json:
          type: string
          format: byte
          nullable: true
          description: |
            Base64-encoded canonical anime JSON as it stood on the bridge
            when the conflict was detected (SDD-30 ADR-30-4).
        remote_snapshot_json:
          type: string
          format: byte
          nullable: true
          description: |
            Base64-encoded canonical anime JSON the mobile client attempted
            to write, which diverged from local_snapshot_json (SDD-30 ADR-30-4).

    ActiveSeasonCandidate:
      type: object
      required: [anime_id]
      properties:
        anime_id:
          type: string
        grade:
          type: integer
          nullable: true
        grade_source:
          type: string

    ActiveSeasonSnapshot:
      type: object
      required: [season_id, candidates]
      properties:
        season_id:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ActiveSeasonCandidate'

    BridgeStatus:
      type: object
      required: [status, last_changelog_id]
      properties:
        status:
          type: string
        last_changelog_id:
          type: integer
        last_changed_at_ms:
          type: integer
          nullable: true
        server_address:
          type: string

    ReconcileRequest:
      type: object
      properties:
        device_id:
          type: string
        last_changelog_id:
          type: integer
        pending_operations:
          type: array
          items:
            type: object
            properties:
              anime_id:
                type: string
              operation:
                type: string
              payload:
                type: object
              created_at:
                type: integer

    ReconcileResponse:
      type: object
      required: [status, last_changelog_id, applied_operations, bridge_changes, conflicts]
      properties:
        status:
          type: string
        last_changelog_id:
          type: integer
        applied_operations:
          type: array
          items:
            $ref: '#/components/schemas/AppliedOperation'
        bridge_changes:
          type: array
          items:
            $ref: '#/components/schemas/AnimeChange'
        conflicts:
          type: array
          items:
            type: object

paths:
  /api/devices/pair:
    post:
      summary: Pair a mobile device
      description: |
        Validates the pairing token displayed in the Bridge UI and registers the device.
        Returns a persistent auth_token for subsequent authenticated requests.
        No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_token, device_name]
              additionalProperties: false
              properties:
                pairing_token:
                  type: string
                device_name:
                  type: string
      responses:
        '201':
          description: Device paired successfully
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_name, auth_token]
                properties:
                  device_id:
                    type: string
                  device_name:
                    type: string
                  auth_token:
                    type: string
        '400':
          description: Invalid request body or pairing request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid pairing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices:
    get:
      summary: List paired devices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paired devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfo'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/{id}:
    delete:
      summary: Revoke a paired device
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/seasons/active:
    get:
      summary: Fetch the active season snapshot
      description: |
        Returns the current active-season snapshot mobile uses to hydrate season
        candidates and bridge-owned premiere grades.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active season snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSeasonSnapshot'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active season
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Active season read failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Active season snapshot unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/animes:
    get:
      summary: List all effective animes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Full effective anime snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anime'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/animes/{id}:
    get:
      summary: Fetch one anime by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Normalized anime snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anime'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Anime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Patch anime state
      description: |
        Partially updates the state of an anime entry identified by its legacy ID.
        All body fields are optional; truly-unknown fields (neither an English patch
        field nor a deprecated Spanish one) are silently ignored.
        Business rule: if episodesWatched >= totalEpisodes and totalEpisodes > 0,
        status is forced to 1 (completed).

        SDD-56 BREAKING CHANGE (supersedes SDD-55's additive alias behavior): the
        request body is English-only. `estado`, `nrocapvisto`, `dias`, and
        `fechaUltCapVisto` are deprecated Spanish keys and are REJECTED with `400`
        when present WITHOUT their English replacement. If both the English key and
        its deprecated Spanish counterpart are present for the same concept, the
        request still succeeds (`200`): the English value is applied and the stale
        Spanish value is ignored.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: |
                    English patch field. The deprecated Spanish key `estado` is
                    rejected with 400 unless `status` is also present.
                episodesWatched:
                  type: number
                  minimum: 0
                  description: |
                    English patch field. The deprecated Spanish key `nrocapvisto`
                    is rejected with 400 unless `episodesWatched` is also present.
                lastWatchedAt:
                  type: integer
                  nullable: true
                  description: |
                    English patch field, epoch milliseconds. The deprecated
                    Spanish key `fechaUltCapVisto` is rejected with 400 unless
                    `lastWatchedAt` is also present. The `$$date` extended-JSON
                    wrapper is no longer accepted (SDD-56); sending
                    `{"lastWatchedAt":{"$$date":...}}` is a 400.
                days:
                  type: array
                  items:
                    type: string
                  description: |
                    English patch field. The deprecated Spanish key `dias` is
                    rejected with 400 unless `days` is also present.
                base:
                  type: integer
                  nullable: true
                  description: |
                    SDD-30 ADR-30-2/30-5: the modified_at OCC token the client
                    last observed for this anime (echoed from the Anime
                    schema's modified_at field). Omit entirely for an old
                    client that has never seen a token (treated as a safe
                    path, never a silent overwrite); send the last-known
                    value, including 0, otherwise. A mismatch never blocks
                    the write -- both values are kept and a conflict is
                    recorded for manual resolution.
      responses:
        '200':
          description: Patch applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '400':
          description: |
            Invalid field value, malformed body, OR a deprecated Spanish patch
            key (`estado`, `nrocapvisto`, `dias`, `fechaUltCapVisto`) present
            without its English replacement (SDD-56 hard cutover). Example
            error message: `field "estado" was renamed to "status"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Anime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/status:
    get:
      summary: Get bridge status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Bridge status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeStatus'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/conflicts:
    get:
      summary: List pending conflicts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending conflicts
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConflictInfo'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/conflicts/{id}/resolve:
    post:
      summary: Resolve a pending conflict
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conflict resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conflict not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/animes/changes:
    get:
      summary: List bridge changes after a timestamp
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Incremental bridge changelog
          content:
            application/json:
              schema:
                type: object
                required: [changes, last_changelog_id]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnimeChange'
                  last_changelog_id:
                    type: integer
        '400':
          description: Invalid query string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sync/reconcile:
    post:
      summary: Trigger sync reconciliation and fetch bridge changes
      description: |
        Accepts a reconcile-compatible body and returns bridge-side changelog entries newer than `last_changelog_id`.
        For compatibility with mobile/offline sync flows, update-compatible `pending_operations` are applied server-side
        using the same validation and durable write rules as `PATCH /api/animes/{id}` before bridge changes are returned.
        Unsupported operation types are ignored.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '202':
          description: Reconciliation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResponse'
        '400':
          description: Invalid request body or invalid pending operation payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seasons/active/ratings:
    post:
      summary: Record a first-episode grade for an anime in the active season
      description: |
        Ingests a mobile-sourced premiere grade (1–6) for an anime in the open season.
        Wire fields are English (see ADR-007). Manual grades captured on the desktop are
        protected: a mobile write is rejected with `409` when a manual grade already exists.
        A season_changed broadcast confirms a recorded grade.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anime_id, grade, rated_at]
              properties:
                anime_id:
                  type: string
                  description: Legacy anime _id
                grade:
                  type: integer
                  minimum: 1
                  maximum: 6
                rated_at:
                  type: integer
                  format: int64
                  description: Epoch milliseconds of the watch/grade moment
      responses:
        '204':
          description: Grade recorded
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active season, or the anime is not a season candidate (terminal, no retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A manual grade already exists and is kept; the body carries it
          content:
            application/json:
              schema:
                type: object
                properties:
                  grade:
                    type: integer
                  source:
                    type: string
                    enum: [manual]
        '422':
          description: Grade outside 1–6, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Season rating ingestion unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
