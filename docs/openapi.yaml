openapi: 3.1.0
info:
  title: Autoreas Bridge API
  version: 1.1.0
  description: |
    REST API exposed by the Autoreas Bridge desktop application on 0.0.0.0:8080.
    Used by mobile clients to pair, bootstrap local SQLite state, fetch incremental
    bridge changelogs, patch anime state, inspect bridge status, and receive real-time events.

    2026-07-19 — SDD-52 API consumer impact: vocabulary-only bridge refactor.
    No HTTP path, REST field, WebSocket message field, or payload shape changed.
    ADR-007 legacy payload names such as `nrocapvisto` and `totalcap` remain byte-identical.

    Excluded endpoints (always return 405 - intentionally undocumented):
      POST   /api/animes
      DELETE /api/animes/{id}

x-websocket:
  path: /ws
  description: |
    WebSocket endpoint for real-time anime change events.
    Authentication: Bearer token via Authorization header OR ?token= query param.
    On connect, server sends: {"type":"sync_required","reason":"connection_gap_assumed"}
    Compatibility inbound message:
      - {"type":"reconcile","device_id":"<id>","last_changelog_id":0,"pending_operations":[...]}
        Update-compatible pending operations are applied through the same validation and durable write path used by PATCH /api/animes/{id}.
    Broadcasts:
      - {"type":"anime_changed","anime_id":"<id>","payload":<object>}
      - {"type":"anime_created","anime_id":"<id>"}
      - {"type":"anime_deleted","anime_id":"<id>"}
  responses:
    101: Upgrade success
    401: Authentication failure
    503: Hub unavailable

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid request body

    StatusOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    StatusAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: accepted

    AnimeDay:
      type: object
      required: [dia, orden]
      properties:
        dia:
          type: string
        orden:
          type: integer

    Anime:
      type: object
      required: [_id, nombre, estado, nrocapvisto, activo, primeravez, dias, generos]
      properties:
        _id:
          type: string
        nombre:
          type: string
        estado:
          type: integer
          minimum: 0
          maximum: 3
        nrocapvisto:
          type: number
          minimum: 0
        totalcap:
          type: integer
          nullable: true
        activo:
          type: integer
          minimum: 0
          maximum: 1
        primeravez:
          type: integer
          minimum: 0
          maximum: 1
        dias:
          type: array
          items:
            $ref: '#/components/schemas/AnimeDay'
        generos:
          type: array
          items:
            type: string
        tipo:
          type: integer
          nullable: true
        fechaUltCapVisto:
          type: integer
          nullable: true
        fechaEstreno:
          type: integer
          nullable: true
        fechaCreacion:
          type: integer
          nullable: true
        fechaEliminacion:
          type: integer
          nullable: true
        portada:
          type: string
          nullable: true
        pagina:
          type: string
          nullable: true
        carpeta:
          type: string
          nullable: true
        estudios:
          type: string
          nullable: true
        origen:
          type: string
          nullable: true
        duracion:
          type: integer
          nullable: true
        modified_at:
          type: integer
          description: |
            Bridge-private, strictly-monotonic optimistic-concurrency version
            token (SDD-30). Echo this value back as `base` on the next patch
            for this anime so the bridge can fast-forward instead of treating
            the write as a divergent conflict.

    AnimeChange:
      type: object
      required: [record_id, change_type, changed_fields, timestamp]
      properties:
        record_id:
          type: string
        change_type:
          type: string
          enum: [create, update, delete]
        changed_fields:
          type: array
          items:
            type: string
        snapshot:
          $ref: '#/components/schemas/Anime'
        timestamp:
          type: integer

    AppliedOperation:
      type: object
      required: [anime_id, operation, applied]
      properties:
        anime_id:
          type: string
        operation:
          type: string
        applied:
          type: boolean

    DeviceInfo:
      type: object
      required: [device_id, device_name, paired_at_ms]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        paired_at_ms:
          type: integer

    ConflictInfo:
      type: object
      required: [conflict_id, anime_id, detected_at_ms, status]
      properties:
        conflict_id:
          type: string
        anime_id:
          type: string
        detected_at_ms:
          type: integer
        status:
          type: string
        local_snapshot_json:
          type: string
          format: byte
          nullable: true
          description: |
            Base64-encoded canonical anime JSON as it stood on the bridge
            when the conflict was detected (SDD-30 ADR-30-4).
        remote_snapshot_json:
          type: string
          format: byte
          nullable: true
          description: |
            Base64-encoded canonical anime JSON the mobile client attempted
            to write, which diverged from local_snapshot_json (SDD-30 ADR-30-4).

    ActiveSeasonCandidate:
      type: object
      required: [anime_id]
      properties:
        anime_id:
          type: string
        grade:
          type: integer
          nullable: true
        grade_source:
          type: string

    ActiveSeasonSnapshot:
      type: object
      required: [season_id, candidates]
      properties:
        season_id:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ActiveSeasonCandidate'

    BridgeStatus:
      type: object
      required: [status, last_changelog_id]
      properties:
        status:
          type: string
        last_changelog_id:
          type: integer
        last_changed_at_ms:
          type: integer
          nullable: true
        server_address:
          type: string

    ReconcileRequest:
      type: object
      properties:
        device_id:
          type: string
        last_changelog_id:
          type: integer
        pending_operations:
          type: array
          items:
            type: object
            properties:
              anime_id:
                type: string
              operation:
                type: string
              payload:
                type: object
              created_at:
                type: integer

    ReconcileResponse:
      type: object
      required: [status, last_changelog_id, applied_operations, bridge_changes, conflicts]
      properties:
        status:
          type: string
        last_changelog_id:
          type: integer
        applied_operations:
          type: array
          items:
            $ref: '#/components/schemas/AppliedOperation'
        bridge_changes:
          type: array
          items:
            $ref: '#/components/schemas/AnimeChange'
        conflicts:
          type: array
          items:
            type: object

paths:
  /api/devices/pair:
    post:
      summary: Pair a mobile device
      description: |
        Validates the pairing token displayed in the Bridge UI and registers the device.
        Returns a persistent auth_token for subsequent authenticated requests.
        No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_token, device_name]
              additionalProperties: false
              properties:
                pairing_token:
                  type: string
                device_name:
                  type: string
      responses:
        '201':
          description: Device paired successfully
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_name, auth_token]
                properties:
                  device_id:
                    type: string
                  device_name:
                    type: string
                  auth_token:
                    type: string
        '400':
          description: Invalid request body or pairing request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid pairing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices:
    get:
      summary: List paired devices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paired devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfo'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/{id}:
    delete:
      summary: Revoke a paired device
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/seasons/active:
    get:
      summary: Fetch the active season snapshot
      description: |
        Returns the current active-season snapshot mobile uses to hydrate season
        candidates and bridge-owned premiere grades.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active season snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSeasonSnapshot'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active season
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Active season read failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Active season snapshot unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/animes:
    get:
      summary: List all effective animes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Full effective anime snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anime'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/animes/{id}:
    get:
      summary: Fetch one anime by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Normalized anime snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anime'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Anime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Patch anime state
      description: |
        Partially updates the state of an anime entry identified by its legacy ID.
        All body fields are optional; unknown fields are silently ignored.
        Business rule: if nrocapvisto >= totalcap and totalcap > 0, estado is forced to 1 (completed).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: integer
                  minimum: 0
                  maximum: 3
                nrocapvisto:
                  type: number
                  minimum: 0
                dias:
                  type: array
                  items:
                    type: string
                base:
                  type: integer
                  nullable: true
                  description: |
                    SDD-30 ADR-30-2/30-5: the modified_at OCC token the client
                    last observed for this anime (echoed from the Anime
                    schema's modified_at field). Omit entirely for an old
                    client that has never seen a token (treated as a safe
                    path, never a silent overwrite); send the last-known
                    value, including 0, otherwise. A mismatch never blocks
                    the write -- both values are kept and a conflict is
                    recorded for manual resolution.
      responses:
        '200':
          description: Patch applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '400':
          description: Invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Anime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/status:
    get:
      summary: Get bridge status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Bridge status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeStatus'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/conflicts:
    get:
      summary: List pending conflicts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending conflicts
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConflictInfo'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/conflicts/{id}/resolve:
    post:
      summary: Resolve a pending conflict
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conflict resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conflict not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/animes/changes:
    get:
      summary: List bridge changes after a timestamp
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Incremental bridge changelog
          content:
            application/json:
              schema:
                type: object
                required: [changes, last_changelog_id]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnimeChange'
                  last_changelog_id:
                    type: integer
        '400':
          description: Invalid query string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sync/reconcile:
    post:
      summary: Trigger sync reconciliation and fetch bridge changes
      description: |
        Accepts a reconcile-compatible body and returns bridge-side changelog entries newer than `last_changelog_id`.
        For compatibility with mobile/offline sync flows, update-compatible `pending_operations` are applied server-side
        using the same validation and durable write rules as `PATCH /api/animes/{id}` before bridge changes are returned.
        Unsupported operation types are ignored.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '202':
          description: Reconciliation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResponse'
        '400':
          description: Invalid request body or invalid pending operation payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seasons/active/ratings:
    post:
      summary: Record a first-episode grade for an anime in the active season
      description: |
        Ingests a mobile-sourced premiere grade (1–6) for an anime in the open season.
        Wire fields are English (see ADR-007). Manual grades captured on the desktop are
        protected: a mobile write is rejected with `409` when a manual grade already exists.
        A season_changed broadcast confirms a recorded grade.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anime_id, grade, rated_at]
              properties:
                anime_id:
                  type: string
                  description: Legacy anime _id
                grade:
                  type: integer
                  minimum: 1
                  maximum: 6
                rated_at:
                  type: integer
                  format: int64
                  description: Epoch milliseconds of the watch/grade moment
      responses:
        '204':
          description: Grade recorded
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active season, or the anime is not a season candidate (terminal, no retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A manual grade already exists and is kept; the body carries it
          content:
            application/json:
              schema:
                type: object
                properties:
                  grade:
                    type: integer
                  source:
                    type: string
                    enum: [manual]
        '422':
          description: Grade outside 1–6, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Season rating ingestion unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
