  /api/animes/{id}:
    get:
      summary: Fetch one anime by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Normalized anime snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anime'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Anime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Patch anime state
      description: |
        Partially updates the state of an anime entry identified by its legacy ID.
        All body fields are optional; truly-unknown fields (neither an English patch
        field nor a deprecated Spanish one) are silently ignored.
        Business rule: if episodesWatched >= totalEpisodes and totalEpisodes > 0,
        status is forced to 1 (completed).

        SDD-56 BREAKING CHANGE (supersedes SDD-55's additive alias behavior): the
        request body is English-only. `estado`, `nrocapvisto`, `dias`, and
        `fechaUltCapVisto` are deprecated Spanish keys and are REJECTED with `400`
        when present WITHOUT their English replacement. If both the English key and
        its deprecated Spanish counterpart are present for the same concept, the
        request still succeeds (`200`): the English value is applied and the stale
        Spanish value is ignored.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: |
                    English patch field. The deprecated Spanish key `estado` is
                    rejected with 400 unless `status` is also present.
                episodesWatched:
                  type: number
                  minimum: 0
                  description: |
                    English patch field. The deprecated Spanish key `nrocapvisto`
                    is rejected with 400 unless `episodesWatched` is also present.
                lastWatchedAt:
                  type: integer
                  nullable: true
                  description: |
                    English patch field, epoch milliseconds. The deprecated
                    Spanish key `fechaUltCapVisto` is rejected with 400 unless
                    `lastWatchedAt` is also present. The `$$date` extended-JSON
                    wrapper is no longer accepted (SDD-56); sending
                    `{"lastWatchedAt":{"$$date":...}}` is a 400.
                days:
                  type: array
                  items:
                    type: string
                  description: |
                    English patch field. The deprecated Spanish key `dias` is
                    rejected with 400 unless `days` is also present.
                base:
                  type: integer
                  nullable: true
                  description: |
                    SDD-30 ADR-30-2/30-5: the modified_at OCC token the client
                    last observed for this anime (echoed from the Anime
                    schema's modified_at field). Omit entirely for an old
                    client that has never seen a token (treated as a safe
                    path, never a silent overwrite); send the last-known
                    value, including 0, otherwise. A mismatch never blocks
                    the write -- both values are kept and a conflict is
                    recorded for manual resolution.
      responses:
        '200':
          description: Patch applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '400':
          description: |
            Invalid field value, malformed body, OR a deprecated Spanish patch
            key (`estado`, `nrocapvisto`, `dias`, `fechaUltCapVisto`) present
            without its English replacement (SDD-56 hard cutover). Example
            error message: `field "estado" was renamed to "status"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Anime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

