# Release entry point.
#
# Pushing a `vX.Y.Z` tag builds both platforms and PUBLISHES a GitHub release
# carrying every artifact plus the CHANGELOG section for that version.
#
# It publishes rather than drafting because the release has to be official to be
# installable: a draft is invisible to anyone testing a build, and its assets are
# not reachable from the tag. Corrections ship as patch releases (1.8.1, 1.8.2),
# never by re-cutting a tag that people may already have downloaded.
#
# Running it manually from the Actions tab builds both platforms and publishes
# nothing -- the publish job is tag-only.
#
# Branch model: `dev` carries development, `main` carries deployments. A release
# therefore only exists once dev has been merged into main, and the guard job
# below refuses to build a tag that does not sit on main.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on every trigger so the build jobs can depend on it unconditionally;
  # the check itself applies only to tags. A job-level `if` would skip this job
  # on workflow_dispatch and skip everything that needs it along with it.
  guard:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tagged commit must be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. main is the deployment branch: merge dev into main, then tag the merge."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA} is on main"

  windows:
    needs: guard
    uses: ./.github/workflows/build-windows.yml

  linux:
    needs: guard
    uses: ./.github/workflows/build-linux.yml

  publish:
    name: Publish the release
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release body is the changelog, not the git log. A tag whose version
      # has no CHANGELOG.md section is an incomplete release, so this fails
      # rather than shipping empty notes.
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # CHANGELOG.md is CRLF-encoded; the carriage returns have to go or
          # every line of the release body ends in a stray ^M.
          section="$(awk -v needle="## [${version}]" '
            index($0, needle) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md | tr -d '\r')"
          if [ -z "$(printf '%s' "${section}" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi
          {
            echo "body<<CHANGELOG_SECTION_EOF"
            printf '%s\n' "${section}"
            echo "CHANGELOG_SECTION_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish the release
        # Pinned to a commit, not the `v2` tag: this action holds
        # `contents: write` and publishes the release, so it is the single most
        # privileged third-party step in the pipeline (SonarQube
        # githubactions:S7637).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Autoreas Bridge ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*
          draft: false
          fail_on_unmatched_files: true
