# Builds the Linux release artifact: a tar.gz holding the portable binary.
#
# Called by release.yml on a `v*` tag, and runnable on its own from the Actions
# tab so the Linux build can be proven between releases.
#
# What this build is NOT: the Windows-only surfaces are compiled out by build
# tags and replaced with clearly-labelled no-ops --
# internal/notification/desktop_other.go never delivers a toast,
# internal/autostart/registry_other.go reports the platform unavailable,
# internal/download/crypto/crypto_other.go is a non-secure fake, and the system
# tray has no bindings outside `windows && cgo`. The Linux artifact is the app
# minus those integrations, not a second first-class desktop build.
name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with frontend/package.json -> packageManager.
  BUN_VERSION: "1.3.11"

jobs:
  build:
    name: linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Wails v2 links GTK3 and WebKit2GTK through cgo/pkg-config. Ubuntu 24.04
      # only ships webkit2gtk-4.1, and wails' gtk.go pkg-configs webkit2gtk-4.0
      # unless the `webkit2_41` build tag is set -- hence the -tags below.
      - name: Install the GTK and WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `wails build` runs the frontend itself through wails.json ->
      # frontend:install / frontend:build, so Bun has to exist before the build
      # step rather than before a frontend step -- there is no separate one.
      # Pinned to a commit, not the `v2` tag: a tag can be repointed at different
      # code by whoever controls the repository, which is what makes it a supply
      # chain risk (SonarQube githubactions:S7637). The comment carries the
      # human-readable version so an upgrade stays reviewable.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Resolved from go.mod instead of pinned twice: the CLI that generates the
      # bindings and the library the app links against must be the same version.
      - name: Install the Wails CLI pinned by go.mod
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          if [ -z "${version}" ]; then
            echo "::error::could not resolve github.com/wailsapp/wails/v2 from go.mod"
            exit 1
          fi
          echo "Installing the Wails CLI ${version}"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${version}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Resolve the release version
        id: version
        run: |
          version="$(jq -er '.info.productVersion' wails.json)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match wails.json productVersion ${version} (expected v${version})"
            exit 1
          fi
          echo "Release version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # bridgeVersion is stamped at link time, not read from wails.json at
      # runtime: internal/desktop/app_backup.go declares `var bridgeVersion = "dev"`
      # and every exported backup bundle carries it, surfaced to the user in the
      # import preview. An unstamped release build labels its bundles "dev".
      #
      # The import path is derived, never typed: `go list` fails loudly if the
      # package moves, whereas a stale -X path links silently (ADR-018).
      - name: Build the app
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg="$(go list -f '{{.ImportPath}}' ./internal/desktop)"
          if [ -z "${pkg}" ]; then
            echo "::error::could not resolve the desktop package for the -X stamp"
            exit 1
          fi
          echo "STAMP_PKG=${pkg}" >> "${GITHUB_ENV}"
          wails build -platform linux/amd64 -clean -tags webkit2_41 -ldflags "-X ${pkg}.bridgeVersion=${VERSION}"

      # Runs the package's own test with the -X applied, because a test inside
      # the package can read the unexported variable the linker wrote. See
      # internal/desktop/app_backup_stamp_test.go for why every check that
      # inspects the binary from outside was tried here and discarded: two of
      # them shipped, and neither could report the truth. One could never fail,
      # the other could never pass on this platform.
      #
      # `-tags webkit2_41` and CGO_ENABLED match the shipped build. They did not
      # fix the original failure, but a readback compiled from a different
      # variant than the artifact is checking the wrong binary whichever answer
      # it gives.
      - name: Verify the version stamp resolved
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          probe="stamp-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! STAMP_PROBE_EXPECT="${probe}" go test -count=1 -run TestBridgeVersionIsStampable \
            -tags webkit2_41 -ldflags "-X ${STAMP_PKG}.bridgeVersion=${probe}" ./internal/desktop/; then
            echo "::error::the -X stamp did not resolve against ${STAMP_PKG}.bridgeVersion; backups exported by this build would report 'dev'"
            exit 1
          fi
          echo "Stamp resolved: ${STAMP_PKG}.bridgeVersion=${VERSION}"

      - name: Install nfpm
        # Pinned to a commit rather than the v2.47.0 tag (SonarQube
        # githubactions:S8545). Go's checksum database already makes a published
        # version immutable, so this is belt-and-braces rather than a fix for a
        # live hole -- but it costs nothing and states the intent outright.
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@40c7c8f7376400e9464d04a2a099045cf5598f8e # v2.47.0

      # Resizes the 1024x1024 source icon into the hicolor theme's standard
      # sizes. 1.8.2 shipped the 1024 original into /usr/share/pixmaps instead,
      # and the software store drew a generic package icon: pixmaps is a legacy
      # path the desktop shell searches, not the icon stock an AppStream
      # `type="stock"` icon resolves against.
      - name: Render the icon into the hicolor sizes
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick
          if command -v magick >/dev/null 2>&1; then im=magick; else im=convert; fi
          for size in 48 64 128 256 512; do
            dir="build/linux/generated/icons/${size}x${size}/apps"
            mkdir -p "${dir}"
            "${im}" build/appicon.png -resize "${size}x${size}"               "${dir}/io.github.disble.autoreas-bridge.png"
            produced="$(file -b "${dir}/io.github.disble.autoreas-bridge.png")"
            case "${produced}" in
              *"${size} x ${size}"*) echo "${size}x${size} ok" ;;
              *) echo "::error::expected a ${size}x${size} PNG, got: ${produced}"; exit 1 ;;
            esac
          done

      # The version is substituted rather than written into the XML, so
      # wails.json stays the only place a version is declared.
      - name: Render the AppStream metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/linux/generated
          rendered=build/linux/generated/io.github.disble.autoreas-bridge.metainfo.xml
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@DATE@/$(date -u +%Y-%m-%d)/g"             build/linux/io.github.disble.autoreas-bridge.metainfo.xml.in > "${rendered}"
          if grep -q '@VERSION@\|@DATE@' "${rendered}"; then
            echo "::error::the metainfo template still holds unsubstituted placeholders"
            exit 1
          fi
          # The missing <icon> is what made 1.8.2 render as a generic package.
          if ! grep -q '<icon type="stock">io.github.disble.autoreas-bridge</icon>' "${rendered}"; then
            echo "::error::the metainfo declares no stock icon; the store would fall back to a generic package icon"
            exit 1
          fi
          cat "${rendered}"

      # Malformed AppStream is not a build error -- the package installs fine and
      # the store listing is simply wrong again, which is the failure this file
      # exists to fix. So it is validated here rather than discovered by a user.
      - name: Validate the AppStream metadata
        run: |
          sudo apt-get install -y --no-install-recommends appstream
          appstreamcli validate --no-net build/linux/generated/io.github.disble.autoreas-bridge.metainfo.xml

      # The .deb is the primary Linux artifact. The tarball ships a bare ELF, so
      # a machine without WebKitGTK 4.1 fails with
      # `libwebkit2gtk-4.1.so.0: cannot open shared object file` and nothing
      # tells the user what to install. The package declares that dependency, so
      # apt resolves it, and it installs a .desktop entry and icon besides.
      - name: Build the Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          chmod +x build/bin/autoreas-bridge
          nfpm pkg --packager deb --config build/linux/nfpm.yaml             --target "dist/autoreas-bridge-${VERSION}-linux-amd64.deb"

      # Reads the package back rather than trusting that nfpm did what the
      # config said. A .deb that installs but declares no WebKit dependency
      # reproduces the exact failure this package exists to remove, and it fails
      # on the user's machine, not here.
      - name: Verify the package declares its runtime dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb="dist/autoreas-bridge-${VERSION}-linux-amd64.deb"
          dpkg-deb --info "${deb}"
          echo "--- contents ---"
          dpkg-deb --contents "${deb}"
          depends="$(dpkg-deb --field "${deb}" Depends)"
          echo "--- Depends: ${depends} ---"
          for required in libwebkit2gtk-4.1-0 libgtk-3-0; do
            case "${depends}" in
              *"${required}"*) ;;
              *) echo "::error::${deb} does not depend on ${required}; installing it would reproduce the missing-shared-library failure"; exit 1 ;;
            esac
          done
          version="$(dpkg-deb --field "${deb}" Version)"
          if [ "${version}" != "${VERSION}" ]; then
            echo "::error::package declares Version ${version}, expected ${VERSION}"
            exit 1
          fi
          expected='./usr/bin/autoreas-bridge
          ./usr/share/applications/io.github.disble.autoreas-bridge.desktop
          ./usr/share/metainfo/io.github.disble.autoreas-bridge.metainfo.xml
          ./usr/share/icons/hicolor/48x48/apps/io.github.disble.autoreas-bridge.png
          ./usr/share/icons/hicolor/64x64/apps/io.github.disble.autoreas-bridge.png
          ./usr/share/icons/hicolor/128x128/apps/io.github.disble.autoreas-bridge.png
          ./usr/share/icons/hicolor/256x256/apps/io.github.disble.autoreas-bridge.png
          ./usr/share/icons/hicolor/512x512/apps/io.github.disble.autoreas-bridge.png'
          for path in $(echo "${expected}" | tr -d ' '); do
            if ! dpkg-deb --contents "${deb}" | grep -q " ${path}\$"; then
              echo "::error::${deb} is missing ${path}"
              exit 1
            fi
          done
          echo "Package declares ${depends} and carries every expected path"

      # Still published for distributions apt cannot serve. Unlike the Windows
      # portable exe -- which duplicated the installer on the same platform --
      # this is the only artifact a non-Debian distro can use.
      - name: Stage the tarball and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "dist/autoreas-bridge-${VERSION}-linux-amd64.tar.gz" -C build/bin autoreas-bridge
          (cd dist && sha256sum ./*.deb ./*.tar.gz > SHA256SUMS-linux-amd64.txt)
          ls -l dist

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autoreas-bridge-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
