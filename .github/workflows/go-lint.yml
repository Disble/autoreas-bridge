name: Go lint

on:
  push:
  pull_request:

jobs:
  all-profile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Run pinned Go lint entrypoint
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/lint.ps1 -Profile all
