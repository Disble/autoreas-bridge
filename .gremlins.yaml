# Gremlins mutation testing for the Go side of the bridge.
#
# Why this exists: `go test -race` cannot run here (the race detector needs a C
# toolchain on Windows, which the pure-Go modernc.org/sqlite driver exists to
# avoid), so tests are judged by whether they actually fail when the code is
# broken rather than by a detector. Gremlins automates that check.
#
# Run it SCOPED, never across the whole module: gremlins re-runs a package's
# tests once per mutant, and this module's suite bootstraps SQLite and starts
# schedulers. See docs/mutation-testing.md for the supported invocations.

silent: false

unleash:
  # false: each mutant runs only the tests of its own package. Turning this on
  # runs the entire module suite per mutant, which is untenable here.
  integration: false
  dry-run: false
  # Thresholds stay 0 (advisory) at the repo level: existing packages have not
  # been through a mutation pass, so a global gate would fail on inherited
  # debt rather than on the change under review. Pass --threshold-efficacy on
  # the command line when gating a specific package.
  threshold:
    efficacy: 0
    mutant-coverage: 0
  exclude-files:
    # Test doubles and fixtures: mutating them proves nothing about production
    # behaviour, and their assertions are the oracle, not the subject.
    - ".*_test\\.go"
    # Build tooling and one-shot generators are not part of the shipped binary.
    - "^tools/.*"
    # Frontend holds no Go source; excluded so it never appears in a report.
    # NOTE: this does NOT make gremlins faster. exclude-files filters which
    # mutants are selected, it does not stop gremlins copying the module tree
    # into its temp workdir -- and that copy, over frontend/node_modules
    # (~130k files), is what makes a run here take 12+ minutes instead of
    # ~16 seconds. Run from a node_modules-free checkout instead; see
    # docs/mutation-testing.md.
    - "^frontend/.*"

mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-negatives:
    enabled: true
  # Off by default upstream and left off here: these produce a high share of
  # equivalent mutants (semantically identical code) that cost a full test run
  # each to disprove. Enable deliberately for a package under active review.
  invert-assignments:
    enabled: false
  invert-bitwise:
    enabled: false
  invert-bwassign:
    enabled: false
  invert-logical:
    enabled: false
  invert-loopctrl:
    enabled: false
  remove-self-assignments:
    enabled: false
